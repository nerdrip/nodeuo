<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UO-Node Admin</title>
<link rel="stylesheet" href="/admin-assets/admin.css" />
<script src="/admin-assets/admin-core.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font: 13px/1.45 'Consolas', 'Cascadia Mono', monospace;
    color: #d8c89a;
    background: #1a1410;
  }
  header {
    display: flex; align-items: center;
    background: linear-gradient(180deg, #2b1e0e 0%, #1a1410 100%);
    border-bottom: 2px solid #7a5a20;
    padding: 8px 16px; gap: 18px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 4px; color: #ffd070; }
  header .stat { font-size: 11px; opacity: .8; }
  header .stat b { color: #ffd070; }
  nav {
    background: #20180e;
    border-bottom: 1px solid #4a3818;
    display: flex; padding: 0;
  }
  nav button {
    background: transparent; border: 0; color: #9a8a60;
    padding: 8px 18px; cursor: pointer; font: inherit;
    border-bottom: 2px solid transparent;
  }
  nav button:hover { color: #ffd070; }
  nav button.active { color: #ffd070; border-bottom-color: #ffd070; }
  main { padding: 16px; min-height: calc(100vh - 96px); }
  .card {
    background: #20180e; border: 1px solid #4a3818;
    padding: 12px; margin-bottom: 12px; border-radius: 4px;
  }
  .card h2 { margin: 0 0 8px 0; font-size: 13px; color: #ffd070; letter-spacing: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #3a2c14; }
  th { color: #ffd070; font-weight: normal; cursor: pointer; user-select: none; }
  tr:hover td { background: #2a1f10; }
  button {
    background: #3a2c14; color: #ffd070; border: 1px solid #7a5a20;
    padding: 4px 10px; cursor: pointer; font: inherit; border-radius: 2px;
  }
  button:hover { background: #4a3818; }
  button.danger { color: #ff6060; border-color: #803030; }
  button.primary { background: #5a3a18; }
  input, select, textarea {
    background: #14100a; color: #d8c89a; border: 1px solid #4a3818;
    padding: 4px 8px; font: inherit; border-radius: 2px;
  }
  input[type="text"], input[type="number"], input[type="password"] { width: 200px; }
  textarea { width: 100%; min-height: 400px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .pill {
    display: inline-block; padding: 1px 6px; border-radius: 8px;
    font-size: 10px; border: 1px solid currentColor;
  }
  .pill.online { color: #80ff80; }
  .pill.banned { color: #ff6060; }
  .pill.admin  { color: #ffaa20; }
  .pill.gm     { color: #80c0ff; }
  .pill.seer   { color: #c080ff; }
  .pill.counselor  { color: #80ffff; }
  .pill.counsellor { color: #80ffff; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .stat-tile {
    background: #2a1f10; border: 1px solid #4a3818;
    padding: 10px; text-align: center; border-radius: 4px;
  }
  .stat-tile .v { font-size: 22px; color: #ffd070; }
  .stat-tile .k { font-size: 10px; opacity: .7; letter-spacing: 1px; }

  /* Script editor split */
  .script-split { display: grid; grid-template-columns: 320px 1fr; gap: 10px; height: calc(100vh - 200px); }
  .script-tree {
    background: #14100a; border: 1px solid #4a3818;
    overflow: auto; padding: 8px; font-size: 11px;
  }
  .script-tree .item { padding: 2px 4px; cursor: pointer; }
  .script-tree .item:hover { background: #2a1f10; }
  .script-tree .item.active { background: #4a3818; color: #ffd070; }
  .script-tree .dir { color: #80c0ff; }
  .script-tree .file { color: #d8c89a; }
  .script-pane { display: flex; flex-direction: column; gap: 6px; }
  .script-pane textarea {
    flex: 1; min-height: 0;
    font: 12px/1.4 'Consolas', monospace; tab-size: 2;
    resize: none;
  }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
              align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #20180e; border: 2px solid #7a5a20; padding: 18px;
           min-width: 320px; max-width: 600px; border-radius: 4px; }
  .modal h3 { margin: 0 0 12px; color: #ffd070; }

  /* Mobile preview block */
  .preview {
    background: #14100a; border: 1px solid #4a3818;
    padding: 8px; font-size: 11px;
  }
  .preview .kv { display: grid; grid-template-columns: 80px 1fr; gap: 2px 8px; }
  .preview .kv b { color: #ffd070; font-weight: normal; }
  .scroll-h { max-height: 320px; overflow: auto; }

  details summary { cursor: pointer; padding: 4px 0; color: #ffd070; }
</style>
</head>
<body>

<header>
  <h1>UO·NODE · ADMIN</h1>
  <div class="stat">shard: <b id="hd-shard">…</b></div>
  <div class="stat">uptime: <b id="hd-up">…</b></div>
  <div class="stat">mobs: <b id="hd-mobs">…</b></div>
  <div class="stat">items: <b id="hd-items">…</b></div>
  <div class="stat">online: <b id="hd-online">…</b></div>
  <div class="stat">mem: <b id="hd-mem">…</b> MB</div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="stat" id="hd-who" style="opacity:.8">…</span>
    <button onclick="refreshDashboard()">⟳ refresh</button>
    <button onclick="logout()" class="danger">logout</button>
  </div>
</header>

<nav id="tabs">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="accounts" data-min-rank="4">Accounts</button>
  <button data-tab="characters">Characters</button>
  <button data-tab="items">Items</button>
  <button data-tab="assets" data-min-rank="3" style="color:#f0c878">Assets</button>
  <button data-tab="studio" data-min-rank="3" style="color:#f0c878">Content Studio</button>
  <button data-tab="scriptstudio" data-min-rank="3" style="color:#f0c878">Script Studio</button>
  <button data-tab="platform" data-min-rank="3" style="color:#9de5c6">Platform</button>
  <button data-tab="docs" style="color:#72d5e8">Docs</button>
  <button data-tab="scripts" data-min-rank="3">Scripts</button>
  <button data-tab="data" data-min-rank="3">Data (raw)</button>
  <button data-tab="data-editor" data-min-rank="3" style="color:#80ff80">🌳 Data Editor</button>
  <button data-tab="spawners" data-min-rank="3">Spawners</button>
  <button data-tab="world-design" data-min-rank="3" style="color:#8fe3b0">World Design</button>
  <button data-tab="ai-graphs" data-min-rank="3" style="color:#80d8ff">AI Graphs</button>
  <button data-tab="simulators" style="color:#ffd080">Simulators</button>
  <button data-tab="animations" style="color:#c69cff">Animations</button>
  <button data-tab="operations" style="color:#6fe7ff">Operations</button>
  <button data-tab="logs">Logs</button>
  <button data-tab="world">World</button>
  <button data-tab="isoeditor" data-min-rank="3" style="color:#80ff80">🗺 Iso Editor</button>
</nav>

<main id="main"></main>

<div id="modal-host"></div>

<script>
'use strict';

// ---------------------------- HTTP helpers ---------------------------------
// Cookie-based session — `uo_admin` set by POST /api/auth/login. We don't
// touch headers manually; the browser ships the cookie via `credentials:
// 'same-origin'`. A 401 means the session expired → bounce to /login.
async function api(method, url, body, retriedAfterReauth = false) {
  try {
    return await AdminCore.requestBroker.request(method, url, body, {
      signal: AdminCore.viewSignal(), dedupe: method === 'GET',
      cacheTtlMs: method === 'GET' ? 1_000 : 0,
      priority: method === 'GET' ? 1 : 0,
      invalidate: method === 'GET' ? null : '/api/',
    });
  } catch (error) {
    if (error.status === 428 && !retriedAfterReauth) {
      const password = prompt('This critical operation requires your password again.');
      if (password == null) throw new Error('fresh authentication cancelled');
      await AdminCore.requestBroker.request('POST', '/api/auth/reauth', { password }, { dedupe: false, timeoutMs: 8_000 });
      return api(method, url, body, true);
    }
    throw error;
  }
}
async function logout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); }
  finally { location.href = '/login'; }
}
window.logout = logout;

// ---------------------------- Tabs ----------------------------------------
const tabs = {};
function registerTab(name, fn) { tabs[name] = fn; }
function activate(name) {
  const current = document.querySelector('nav button.active')?.dataset?.tab;
  if (current === 'scripts' && name !== 'scripts' && scriptDirty()
      && !confirm('Discard unsaved script changes?')) return;
  if (name !== 'logs' && logTimer) { clearInterval(logTimer); logTimer = null; }
  if (name !== 'animations' && animTimer) { clearInterval(animTimer); animTimer = null; }
  if (name !== 'characters' && liveFollowTimer) { clearInterval(liveFollowTimer); liveFollowTimer = null; }
  if (name !== 'operations' && opsTestPoll) { clearInterval(opsTestPoll); opsTestPoll = null; }
  AdminCore.beginView();
  for (const b of document.querySelectorAll('nav button'))
    b.classList.toggle('active', b.dataset.tab === name);
  document.getElementById('main').innerHTML = '';
  Promise.resolve(tabs[name]?.()).catch((error) => {
    if (error?.name === 'AbortError') return;
    console.error(`[admin-ui] tab ${name} failed`, error);
    AdminCore.renderState(document.getElementById('main'), 'error', {
      message: error?.message || `Could not load ${name}.`, retry: () => activate(name),
    });
  });
  location.hash = name;
}
document.querySelectorAll('nav button').forEach((b) =>
  b.addEventListener('click', () => activate(b.dataset.tab)));

// ---------------------------- Dashboard -----------------------------------
async function refreshDashboard() {
  if (document.hidden || refreshDashboard.inFlight) return;
  refreshDashboard.inFlight = true;
  try {
    const refreshIdentity = !refreshDashboard.me || Date.now() - (refreshDashboard.meAt || 0) >= 60_000;
    const [s, me] = await Promise.all([
      api('GET', '/api/world/stats'),
      refreshIdentity ? api('GET', '/api/auth/me').catch(() => null) : Promise.resolve(refreshDashboard.me),
    ]);
    if (refreshIdentity && me) {
      refreshDashboard.me = me;
      refreshDashboard.meAt = Date.now();
    }
    document.getElementById('hd-shard').textContent  = s.shard;
    document.getElementById('hd-up').textContent     = formatUptime(s.uptime);
    document.getElementById('hd-mobs').textContent   = s.mobiles;
    document.getElementById('hd-items').textContent  = s.items;
    document.getElementById('hd-online').textContent = s.onlinePlayers;
    document.getElementById('hd-mem').textContent    = s.memoryMB;
    if (me) {
      const ranks = { Player:0, Counselor:1, Counsellor:1, Seer:2, GameMaster:3, GM:3, Admin:4 };
      const rank = ranks[me.accessLevel] ?? 0;
      document.querySelectorAll('[data-min-rank]').forEach((element) => {
        element.hidden = rank < Number(element.dataset.minRank);
      });
      const cnt = (me.characters || []).length;
      document.getElementById('hd-who').textContent =
        `▣ ${me.account} (${me.accessLevel}, ${cnt} char${cnt === 1 ? '' : 's'})`;
    }
  } catch { /* ignore */ }
  finally { refreshDashboard.inFlight = false; }
}
function formatUptime(s) {
  s = s | 0;
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600);  s -= h * 3600;
  const m = Math.floor(s / 60);
  return `${d}d ${h}h ${m}m`;
}

registerTab('dashboard', async () => {
  const s = await api('GET', '/api/world/stats');
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>Shard overview</h2>
      <div class="stats-grid">
        <div class="stat-tile"><div class="v">${s.mobiles}</div><div class="k">MOBILES</div></div>
        <div class="stat-tile"><div class="v">${s.items}</div><div class="k">ITEMS</div></div>
        <div class="stat-tile"><div class="v">${s.onlinePlayers}</div><div class="k">ONLINE</div></div>
        <div class="stat-tile"><div class="v">${s.accounts}</div><div class="k">ACCOUNTS</div></div>
        <div class="stat-tile"><div class="v">${s.scripts}</div><div class="k">SCRIPTS</div></div>
        <div class="stat-tile"><div class="v">${s.memoryMB}M</div><div class="k">RSS</div></div>
        <div class="stat-tile"><div class="v">${formatUptime(s.uptime)}</div><div class="k">UPTIME</div></div>
        <div class="stat-tile"><div class="v">${s.nodeVersion}</div><div class="k">NODE</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Quick actions</h2>
      <div class="row">
        <button class="primary" onclick="doSave()">💾 Save world</button>
        <button onclick="doReload()">↻ Reload scripts</button>
        <button onclick="doBroadcast()">📢 Broadcast…</button>
      </div>
    </div>
  `;
});

async function doSave() {
  try {
    const r = await api('POST', '/api/world/save');
    alert(`saved: ${r.bytes ?? 0} bytes in ${r.ms ?? 0} ms`);
  } catch (e) { alert('save failed: ' + e.message); }
}
async function doReload() {
  try {
    const r = await api('POST', '/api/scripts/reload');
    alert(`scripts reloaded (${r.loaded} loaded in ${r.ms} ms)`);
  } catch (e) { alert('reload failed: ' + e.message); }
}
async function doBroadcast() {
  const text = prompt('Broadcast text to every online player:');
  if (!text) return;
  try {
    const r = await api('POST', '/api/world/broadcast', { text });
    alert(`sent to ${r.sentTo} players`);
  } catch (e) { alert('broadcast failed: ' + e.message); }
}

// ---------------------------- Accounts ------------------------------------
registerTab('accounts', async () => {
  const data = await api('GET', '/api/accounts');
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>Accounts (${data.count})</h2>
      <div id="accounts-table"></div>
    </div>
  `;
  const table=new AdminCore.VirtualTable(document.getElementById('accounts-table'),{
    key:a=>a.username,
    columns:[{label:'Username',width:'minmax(130px,1.2fr)'},{label:'Level'},{label:'Status'},{label:'Chars',width:'70px'},{label:'Created'},{label:'Last login',width:'150px'},{label:'Actions',width:'220px'}],
    renderCells:a=>[
      esc(a.username),`<span class="pill ${a.accessLevel?.toLowerCase()}">${esc(a.accessLevel)}</span>`,
      a.banned?'<span class="pill banned">BANNED</span>':'✓',a.characters,a.created?.slice(0,10)??'',a.lastLogin?.slice(0,16)?.replace('T',' ')??'—',
      `<button onclick="openAccount('${escJS(a.username)}')">view</button><button onclick="editAccount('${escJS(a.username)}','${escJS(a.accessLevel)}',${a.banned?'true':'false'})">edit</button><button class="danger" onclick="deleteAccount('${escJS(a.username)}')">del</button>`,
    ],
  });
  table.setItems(data.accounts); AdminCore.reportClientMetrics({accountsTable:table.snapshot()});
});

async function openAccount(username) {
  const a = await api('GET', `/api/accounts/${encodeURIComponent(username)}`);
  const chars = (a.characters ?? []).map((c, i) => c ? `
    <details>
      <summary>Slot ${i}: ${esc(c.live?.name ?? c.name ?? '?')} ${c.live?.online ? '<span class="pill online">ONLINE</span>' : ''}</summary>
      <div class="preview">${renderMobileKV(c.live)}</div>
    </details>
  ` : '').join('');
  showModal(`Account: ${esc(username)}`, `
    <div class="row"><b>Access:</b> ${esc(a.accessLevel)}  <b>Banned:</b> ${a.banned ? 'yes' : 'no'}</div>
    <div class="row"><b>Created:</b> ${esc(a.created ?? '?')}</div>
    <div class="row"><b>Last login:</b> ${esc(a.lastLogin ?? '?')}</div>
    <h3>Characters</h3>
    ${chars || '<i>no characters</i>'}
  `);
}

async function editAccount(username, level, banned) {
  const levels = ['Player', 'Counselor', 'Seer', 'GameMaster', 'GM', 'Admin'];
  showModal(`Edit account: ${username}`, `
    <label style="display:grid;gap:5px;margin-bottom:12px">Access level
      <select id="account-level" style="width:100%">
        ${levels.map((v) => `<option value="${v}" ${v === level ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
    </label>
    <label style="display:flex;align-items:center;gap:8px">
      <input id="account-banned" type="checkbox" ${banned ? 'checked' : ''} /> Account banned
    </label>
  `, [
    { label: 'Save changes', primary: true, action: async () => {
      await api('PATCH', `/api/accounts/${encodeURIComponent(username)}`, {
        accessLevel: document.getElementById('account-level').value,
        banned: document.getElementById('account-banned').checked,
      });
      activate('accounts');
    } },
    { label: 'Cancel' },
  ]);
}

async function deleteAccount(username) {
  if (!confirm(`Permanently delete account "${username}"?`)) return;
  try {
    await api('DELETE', `/api/accounts/${encodeURIComponent(username)}`);
    activate('accounts');
  } catch (e) { alert('delete failed: ' + e.message); }
}

// ---------------------------- Characters / mobiles ------------------------
let mobsKind = 'players';     // 'players' | 'npcs' | 'all'
let mobOffset = 0;
let liveFollowTimer = null;
const MOB_PAGE = 200;
registerTab('characters', async () => {
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>Characters / mobiles</h2>
      <div class="row" style="border-bottom:1px solid #4a3818;padding-bottom:6px">
        <button data-kind="players" class="kindbtn ${mobsKind === 'players' ? 'primary' : ''}">👤 Players</button>
        <button data-kind="vendors" class="kindbtn ${mobsKind === 'vendors' ? 'primary' : ''}">🛒 Vendors</button>
        <button data-kind="npcs"    class="kindbtn ${mobsKind === 'npcs' ? 'primary' : ''}">🐺 Monsters</button>
        <button data-kind="all"     class="kindbtn ${mobsKind === 'all' ? 'primary' : ''}">All</button>
        <span id="m-count" style="margin-left:auto;opacity:.6"></span>
      </div>
      <div class="row" style="margin-top:6px">
        <input id="m-filter" placeholder="filter by name or 0xSerial" />
        <button onclick="searchMobiles()">search</button>
      </div>
      <div id="mobs-result"></div>
    </div>
    <div class="card" id="mob-detail" style="display:none"></div>
  `;
  document.querySelectorAll('.kindbtn').forEach((b) => b.addEventListener('click', () => {
    mobsKind = b.dataset.kind;
    mobOffset = 0;
    document.querySelectorAll('.kindbtn').forEach((x) => x.classList.toggle('primary', x === b));
    loadMobiles();
  }));
  loadMobiles();
});
async function loadMobiles() {
  const f = document.getElementById('m-filter').value;
  const r = await api('GET', `/api/mobiles?filter=${encodeURIComponent(f)}&kind=${mobsKind}&limit=${MOB_PAGE}&offset=${mobOffset}`);
  document.getElementById('mobs-result').innerHTML = `
    <div id="mobiles-table"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px">
      <button ${mobOffset <= 0 ? 'disabled' : ''} onclick="mobOffset=Math.max(0,mobOffset-MOB_PAGE);loadMobiles()">← Previous</button>
      <span style="opacity:.7">${r.count ? mobOffset + 1 : 0}–${Math.min(r.count, mobOffset + r.mobiles.length)} of ${r.count}</span>
      <button ${mobOffset + r.mobiles.length >= r.count ? 'disabled' : ''} onclick="mobOffset+=MOB_PAGE;loadMobiles()">Next →</button>
    </div>
  `;
  const table=new AdminCore.VirtualTable(document.getElementById('mobiles-table'),{
    key:m=>m.serial,
    columns:[{label:'Serial',width:'120px'},{label:'Name',width:'minmax(130px,1fr)'},{label:'Body',width:'70px'},{label:'Position',width:'130px'},{label:'HP',width:'90px'},{label:'Status',width:'90px'},{label:'Actions',width:'280px'}],
    renderCells:m=>[m.serial,esc(m.name??'?'),m.body,`${m.x},${m.y},${m.z}`,`${m.hp}/${m.hpMax}`,m.online?'<span class="pill online">ONLINE</span>':'',`<button onclick="viewMob('${m.serial}')">view</button><button onclick="tpMyselfHere('${m.serial}')" title="Teleport your character here">tp here</button><button onclick="followLive('${m.serial}')">follow</button>${m.online?`<button class="danger" onclick="kickMob('${m.serial}')">kick</button>`:''}`],
  });
  table.setItems(r.mobiles); AdminCore.reportClientMetrics({mobilesTable:table.snapshot()});
  const cnt = document.getElementById('m-count');
  if (cnt) cnt.textContent = `${r.count} ${mobsKind}`;
  // Remember "last selected mobile" — used by the items tab as the default
  // teleport target. Pick the first online player on each refresh so the
  // typical "tp my admin character to that item" flow doesn't ask every
  // time. User can override via the prompt.
  const firstOnline = r.mobiles.find((m) => m.online);
  if (firstOnline) localStorage.setItem('uo-admin-tp-mob', firstOnline.serial);
}
function searchMobiles() { mobOffset = 0; loadMobiles(); }
async function viewMob(serial) {
  let m;
  try { m = await api('GET', `/api/mobiles/${serial}`); }
  catch (e) { alert('view failed: ' + e.message); return; }
  if (m?.error) { alert('view failed: ' + m.error); return; }
  // Defensive defaults — when the API returns a partial payload (e.g. an
  // offline NPC with no equipped/backpack arrays) the .map() calls used
  // to throw, leaving the panel apparently inert.
  m.equipped         = m.equipped         ?? [];
  m.backpackContents = m.backpackContents ?? [];
  const eq = m.equipped.map((e) => `<li>L${e.layer}: ${esc(e.name ?? '0x'+(e.itemId|0).toString(16))}</li>`).join('');
  const pack = m.backpackContents.map((it) => `<li>${esc(it.name ?? '0x'+(it.itemId|0).toString(16))} ×${it.amount ?? 1}</li>`).join('');
  localStorage.setItem('uo-admin-tp-mob', m.serial);
  const panel = document.getElementById('mob-detail');
  if (!panel) { alert('mob-detail panel missing'); return; }
  panel.style.display = '';
  panel.innerHTML = `
    <h2>${esc(m.name ?? '?')} (${m.serial})  <button class="small" onclick="(async()=>{const r=await api('GET','/api/mobiles/'+'${m.serial}');alert(JSON.stringify(r,null,2));})()">raw</button></h2>
    <div style="display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start">
      <div>
        <div style="background:#000;border:1px solid #4a3818;padding:4px;text-align:center">
          <img alt="paperdoll" src="/api/mobiles/${m.serial}/paperdoll" style="image-rendering:pixelated;max-width:100%"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'paperdoll unavailable',style:'opacity:.6;padding:30px'}))" />
        </div>
        <div style="margin-top:6px">
          <button class="small" onclick="setTpTarget('${m.serial}')">use as tp target</button>

// One-pane editor for every .json under apps/scripts/src/data/. Reads
// from `/api/data/files` for the tree, `/api/data/file?rel=...` for
// content, POST `/api/data/file` to save. Save can optionally trigger
// a full script reload (`?reload=1`) so the change goes live without
// touching .js files (since the hot-watcher only catches .js).
let currentDataPath = null;
let dataReloadOnSave = true;
registerTab('data', async () => {

          <textarea id="d-editor" spellcheck="false"

        </div>
      </div>
    </div>
  `;
  // The file list is flat (rel paths like "config/npcs.json"); group by
  // first segment for a tree-ish view.

function renderDataTree(files) {
  // Group by the first path segment (config / world / world/spawns / etc.)
  const byDir = {};
  for (const f of files) {
    const parts = f.rel.split('/');
    const dir = parts.length > 1 ? parts.slice(0, -1).join('/') : '(root)';
    (byDir[dir] = byDir[dir] ?? []).push(f);
  }
  const dirs = Object.keys(byDir).sort();
  return dirs.map((dir) => {
    const items = byDir[dir].map((f) => {
      const name = f.rel.split('/').pop();
      const kb   = (f.size / 1024).toFixed(1);
      return `<div class="item file" data-rel="${esc(f.rel)}"
                   onclick="openDataFile('${esc(f.rel)}', this)">  ${esc(name)}
                <span style="opacity:.5;font-size:10px">  ${kb}kb</span></div>`;
    }).join('');
    return `<div class="item dir">▾ ${esc(dir)}/</div>${items}`;
  }).join('');
}
async function openDataFile(rel, el) {
  currentDataPath = rel;
  const r = await api('GET', `/api/data/file?rel=${encodeURIComponent(rel)}`);
  if (r.error) { alert(r.error); return; }
  document.getElementById('d-editor').value = r.content;
  document.getElementById('d-status').textContent = `${rel} — ${r.content.length} bytes`;
  document.querySelectorAll('#d-tree .item').forEach((e) => e.classList.remove('active'));
  el?.classList?.add('active');
}
async function saveDataFile() {
  if (!currentDataPath) { alert('no file open'); return; }
  const content = document.getElementById('d-editor').value;
  try {
    const r = await api('POST', '/api/data/file', {
      rel: currentDataPath, content, reload: dataReloadOnSave,
    });
    if (r.error) throw new Error(r.error);
    const tail = r.reloaded ? ` · scripts reloaded (${r.reloaded.loaded} files, ${r.reloaded.ms}ms)` : '';
    document.getElementById('d-status').textContent =
      `${currentDataPath} — saved ${r.bytes} bytes${tail}`;
  } catch (e) { alert('save failed: ' + e.message); }
}
async function reloadDataFile() {
  // Heuristic: each data JSON has one canonical loader script. Map
  // here keeps the surgical reload path (just that script) instead of
  // the slower full-runtime reload.
  const map = {
    'config/npcs.json':              'data.js',
    'world/regional-npcs.json':      'spawns/regional-npcs.js',
    'world/spawns/champions.json':   'spawns/champions.js',
    'world/spawns/moongates.json':   'spawns/moongates.js',
    'world/spawns/despise-pillars.json':       'spawns/despise-pillars.js',

    'world/spawns/aetheric-sanctuary.json':    'spawns/aetheric-sanctuary.js',

    'world/spawns/magincia-bazaar.json':       'spawns/magincia-bazaar-seed.js',
  };
  const target = currentDataPath && map[currentDataPath];
  if (!target) {
    // Unknown mapping → fall back to full reload so the operator's edit
    // still goes live.
    await doReload();
    return;
  }
  try {
    const r = await api('POST', '/api/scripts/reload-one', { rel: target });
    if (!r.ok) throw new Error(r.error || 'reload failed');
    document.getElementById('d-status').textContent =
      `${currentDataPath} — reloaded ${target} (${r.ms}ms)`;
  } catch (e) { alert('reload failed: ' + e.message); }
}

async function saveSpawner(formId, existingId) {
  const form = document.getElementById(formId);
  if (!form) return;
  const data = Object.fromEntries(new FormData(form));
  const payload = {
    id: existingId || data.id,
    map: Number.isInteger(Number(data.map)) ? Number(data.map) : 1,
    rect: {
      x1: parseInt(data.x1, 10) | 0,
      y1: parseInt(data.y1, 10) | 0,
      x2: parseInt(data.x2, 10) | 0,
      y2: parseInt(data.y2, 10) | 0,
    },
    kinds: String(data.kinds || '').split(',').map((s) => s.trim()).filter(Boolean).map((entry) => {
      const match = /^(.*?):(\d+)$/.exec(entry);
      return match ? [match[1].trim(), Math.max(1, Number(match[2]) | 0)] : entry;
    }),
    maxCount: parseInt(data.maxCount, 10) || 5,
    respawnMs: [
      parseInt(data.respawnLo, 10) || 30000,
      parseInt(data.respawnHi, 10) || 120000,
    ],
    proximityRange: parseInt(data.proximityRange, 10) || 0,
    homeRange: parseInt(data.homeRange, 10) || 0,
    team: parseInt(data.team, 10) || 0,
    roaming: data.roaming || 'home',
    enabled: data.enabled === 'on',
    schedule: data.scheduleDays || data.scheduleStart || data.scheduleEnd ? {
      days: String(data.scheduleDays || '').split(',').map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6),
      startHour: parseInt(data.scheduleStart, 10) || 0,
      endHour: parseInt(data.scheduleEnd, 10) || 24,
    } : null,
    regionConditions: data.region || data.minPlayers || data.maxPlayers ? {
      region: String(data.region || ''),
      minPlayers: parseInt(data.minPlayers, 10) || 0,
      maxPlayers: parseInt(data.maxPlayers, 10) || 1000,
    } : null,
  };
  const res = await api('POST', '/api/spawners', payload);
  if (res?.error) { alert('save failed: ' + res.error); return; }
  document.querySelector('[data-tab="spawners"]')?.click();
}

  if(!ids.length){window.AdminCore?.toast?.('Select at least one spawner.','warn');return;}
  const body={ids,action};
  if(action==='move'){body.dx=+document.getElementById('sp-bulk-dx').value||0;body.dy=+document.getElementById('sp-bulk-dy').value||0;const map=document.getElementById('sp-bulk-map').value;if(map!=='')body.map=+map;}
  if(action==='delete'&&!confirm(`Delete ${ids.length} selected spawner groups?`))return;
  const r=await api('POST','/api/spawners/bulk',body);window.AdminCore?.toast?.(`${r.changed??0} spawners: ${action}`,r.ok?'ok':'warn');document.querySelector('[data-tab="spawners"]')?.click();
}
function applySpawnerTemplate(formId,index){
  const t=window.__spawnerTemplates?.[index]?.value;if(!t)return;const f=document.getElementById(formId);if(!f)return;
  for(const [name,value] of Object.entries({maxCount:t.maxCount,respawnLo:t.respawnMs?.[0],respawnHi:t.respawnMs?.[1],proximityRange:t.proximityRange,homeRange:t.homeRange,team:t.team,roaming:t.roaming,kinds:(t.kinds??[]).map(k=>Array.isArray(k)?k.join(':'):k).join(', ')})){if(f.elements[name]&&value!=null)f.elements[name].value=value;}
  if(f.elements.enabled)f.elements.enabled.checked=t.enabled!==false;
}
function renderAiNode(node,index,graph) {
  const ids=[''].concat(graph.nodes.map((n)=>n.id));
  const edge=(field)=>`<select data-field="${field}" aria-label="${esc(node.id)} ${field} edge">${ids.map((v)=>`<option value="${esc(v)}" ${node[field]===v?'selected':''}>${esc(v||'—')}</option>`).join('')}</select>`;
  return `<div class="card aig-node" data-index="${index}" style="width:250px;border-color:${node.id===graph.start?'#d7a941':'#35435a'}">
    <div style="display:flex;justify-content:space-between"><b>#${index+1}</b><button class="small danger" onclick="removeAiNode(${index})">×</button></div>
    <label>Node id <input data-field="id" value="${esc(node.id)}"></label>
    <label>Type <select data-field="type">${aiGraphCatalog.nodeTypes.map((t)=>`<option ${node.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <div class="kv"><b>next</b><div>${edge('next')}</div><b>yes</b><div>${edge('yes')}</div><b>no</b><div>${edge('no')}</div><b>fail</b><div>${edge('fail')}</div></div>
    <label>Params JSON<textarea data-field="params" rows="4">${esc(JSON.stringify(node.params??{},null,2))}</textarea></label></div>`;
}
function collectAiGraph() {
  const graph={id:document.getElementById('aig-id').value,name:document.getElementById('aig-name').value,start:document.getElementById('aig-start').value,nodes:[]};
  for(const el of document.querySelectorAll('.aig-node')){
    const value=(field)=>el.querySelector(`[data-field="${field}"]`).value;
    let params={}; try{params=JSON.parse(value('params')||'{}');}catch{throw new Error(`Invalid params JSON in ${value('id')}`);}
    graph.nodes.push({id:value('id'),type:value('type'),next:value('next'),yes:value('yes'),no:value('no'),fail:value('fail'),params});
  }
  return graph;
}
function selectAiGraph(id){activeAiGraph=structuredClone(aiGraphCatalog.graphs.find((g)=>g.id===id)??newAiGraph());renderAiGraphEditor();}
function addAiNode(){activeAiGraph=collectAiGraph();activeAiGraph.nodes.push({id:`node-${activeAiGraph.nodes.length+1}`,type:'wait',next:activeAiGraph.start,params:{ms:500}});renderAiGraphEditor();}
function removeAiNode(index){activeAiGraph=collectAiGraph();activeAiGraph.nodes.splice(index,1);renderAiGraphEditor();}
async function saveAiGraph(){try{const graph=collectAiGraph();const r=await api('PUT',`/api/ai-graphs/${encodeURIComponent(graph.id)}`,graph);if(!r.ok)throw new Error((r.errors??[r.error]).join('\n'));aiGraphCatalog=await api('GET','/api/ai-graphs');activeAiGraph=structuredClone(r.graph);renderAiGraphEditor();flashToast('AI graph saved and hot-reloaded');}catch(e){alert(e.message);}}
async function deleteAiGraph(){if(!activeAiGraph||!confirm(`Delete ${activeAiGraph.id}?`))return;await api('DELETE',`/api/ai-graphs/${encodeURIComponent(activeAiGraph.id)}`);activate('ai-graphs');}
async function attachAiGraph(){const serial=prompt('Mobile serial (hex or decimal):');if(!serial)return;const r=await api('POST',`/api/ai-graphs/${encodeURIComponent(activeAiGraph.id)}/attach`,{serial});if(r.error)alert(r.error);else flashToast(`Attached ${r.behavior}`);}
Object.assign(window,{newAiGraph,renderAiGraphEditor,selectAiGraph,addAiNode,removeAiNode,saveAiGraph,deleteAiGraph,attachAiGraph});

async function loadAnimationBody(){const body=document.getElementById('anim-body').value;animBodyData=await api('GET',`/api/animations/body/${encodeURIComponent(body)}`);const action=document.getElementById('anim-action');action.innerHTML=(animBodyData.actions??[]).map((a)=>`<option value="${a.action}">${a.action}</option>`).join('');document.getElementById('anim-meta').innerHTML=`<div class="kv"><b>Requested</b><div>${animBodyData.requested}</div><b>Resolved body</b><div>${animBodyData.resolved}${animBodyData.alias?' (body.def alias)':''}</div><b>Type</b><div>${esc(animBodyData.info?.type??'unknown')}</div><b>Status</b><div>${animBodyData.ok?'OK':animBodyData.errors.length+' error(s)'}</div></div>${animBodyData.errors?.length?`<pre style="color:#ff7777">${esc(animBodyData.errors.join('\n'))}</pre>`:''}`;restartAnimation();}

async function refreshLogs(){const pre=document.getElementById('log-pre');if(!pre)return;const filter=document.getElementById('log-filter')?.value??'',level=document.getElementById('log-level')?.value??'';try{const [raw,structured]=await Promise.all([api('GET',`/api/logs?filter=${encodeURIComponent(filter)}&level=${encodeURIComponent(level)}&limit=500`),api('GET',`/api/operations/events?filter=${encodeURIComponent(filter)}&level=${encodeURIComponent(level)}&limit=500`)]);lastLogExport=[...(raw.lines??[]).map(l=>({at:new Date(l.ts).toISOString(),level:/error/i.test(l.line)?'error':/warn/i.test(l.line)?'warn':'info',event:'console',message:l.line})),...(structured.entries??[])].sort((a,b)=>String(a.at).localeCompare(String(b.at)));pre.textContent=lastLogExport.map(e=>`${String(e.at).slice(11,19)} ${String(e.level??'info').padEnd(5)} ${e.event??''} ${e.message??e.line??JSON.stringify(e)}`).join('\n');if(document.getElementById('log-follow')?.checked)pre.scrollTop=pre.scrollHeight}catch(e){if(e.name!=='AbortError')pre.textContent=e.message}}
function exportLogs(){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(lastLogExport,null,2)],{type:'application/json'}));link.download=`nodeuo-logs-${new Date().toISOString().replaceAll(':','-')}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
Object.assign(window,{refreshLogs,exportLogs});

async function doCreateWorld() {
  const r = await api('POST', '/api/world/cmd', { command: 'createworld' });
  showModal('CreateWorld', `<pre>${esc(JSON.stringify(r, null, 2))}</pre>`);
}
async function doRecreateWorld() {
  if (!confirm('Wipe + repopulate every NPC, item, spawner. Players + accounts safe. Continue?')) return;
  // routes.js gates destructive verbs behind `body.confirm === '<cmd>-yes'`
  // (admin audit #8 defence-in-depth — Origin alone isn't enough if a
  // misconfigured proxy strips headers). Without this token the API
  // returned "destructive command requires confirm token" and the
  // browser-side confirm() dialog was the only thing the operator saw.
  const r = await api('POST', '/api/world/cmd',
    { command: 'recreateworld', confirm: 'recreateworld-yes' });
  showModal('RecreateWorld', `<pre>${esc(JSON.stringify(r, null, 2))}</pre>`);
}
async function doWipeWorld() {
  if (!confirm('IRREVERSIBLE: delete every NPC, world item, house and spawner. Player characters + accounts + carried/equipped possessions survive. Continue?')) return;
  if (!confirm('Really wipe? This cannot be undone in-session (saved to disk after wipe).')) return;
  const r = await api('POST', '/api/world/cmd',
    { command: 'wipeworld', confirm: 'wipeworld-yes' });
  showModal('WipeWorld', `<pre>${esc(JSON.stringify(r, null, 2))}</pre>`);
}

// Heavy visual workbenches live on their own routes, while the admin shell
// embeds them as same-origin frames. Probe the backend before inserting a
// frame: a browser can keep this shell painted after the server exits, and a
// raw iframe then degrades into Chromium's opaque "127.0.0.1 refused" page.
// The explicit offline state tells the operator exactly what to restart and
// offers an in-place retry once Server + Admin is listening again.
async function renderEmbeddedWorkbench({ title, description, src, background = '#080b0f', compact = false }) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card" style="padding:0!important;margin-bottom:0;height:calc(100vh - ${compact ? 132 : 96}px);overflow:hidden">
      <div style="min-height:38px;padding:7px 10px;border-bottom:1px solid #4a3818;display:flex;align-items:center;gap:10px">
        <b style="color:#ffd070">${esc(title)}</b>
        <span style="opacity:.65;font-size:11px">${esc(description)}</span>
        <span style="flex:1"></span>
        <a href="${esc(src)}" target="_blank" rel="noopener" style="color:#80c0ff;text-decoration:none">↗ pop out (new tab)</a>
      </div>
      <div data-embedded-host style="height:calc(100% - 38px);position:relative;background:${esc(background)}">
        <div style="height:100%;display:grid;place-items:center;color:#9a8a60">Connecting to editor…</div>
      </div>
    </div>`;
  const host = main.querySelector('[data-embedded-host]');
  const viewSignal = AdminCore.viewSignal();
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2_500);
  viewSignal?.addEventListener('abort', () => controller.abort(), { once: true });
  let online = false;
  let incompatibility = '';
  try {
    const health = await fetch('/healthz', {
      cache: 'no-store', credentials: 'same-origin', signal: controller.signal,
    });
    if (health.ok) {
      // Probe the actual workbench response too. During development an old
      // Node process can serve a newer HTML file while its in-memory security
      // middleware still emits X-Frame-Options:DENY. A health-only check
      // cannot see that mixed-version state and Chromium replaces the iframe
      // with an unhelpful grey blocked-page icon.
      const route = await fetch(src, {
        cache: 'no-store', credentials: 'same-origin', signal: controller.signal,
      });
      const finalPath = new URL(route.url, location.href).pathname;
      if (route.redirected && finalPath === '/login') {
        location.href = '/login';
        return;
      }
      const xFrame = String(route.headers.get('x-frame-options') ?? '').toLowerCase();
      const csp = String(route.headers.get('content-security-policy') ?? '').toLowerCase();
      incompatibility = xFrame === 'deny' || /frame-ancestors\s+'none'/.test(csp)
        ? 'The running admin process still uses the old non-embeddable security policy. Restart Server + Admin to load the current code.'
        : '';
      online = route.ok && !incompatibility;
      route.body?.cancel?.().catch?.(() => {});
    }
  } catch { online = false; }
  finally { clearTimeout(timeout); }
  if (!host?.isConnected) return;
  if (!online) {
    host.innerHTML = `
      <div data-embedded-offline style="height:100%;display:grid;place-items:center;padding:32px">
        <div style="max-width:560px;text-align:center;background:#14100a;border:1px solid #7a5a20;border-radius:6px;padding:24px">
          <div style="font-size:28px;color:#ff8060;margin-bottom:8px">Connection lost</div>
          <p style="color:#d8c89a">${esc(incompatibility || 'The admin backend is offline. Start the Server + Admin variant in UO·Node Control, then retry.')}</p>
          <button type="button" data-embedded-retry>Reconnect / sign in</button>
        </div>
      </div>`;
    // A backend restart invalidates in-memory admin sessions. Reload the
    // top-level shell instead of retrying only the frame; the normal root
    // route will either restore the tab or redirect cleanly to /login.
    host.querySelector('[data-embedded-retry]')?.addEventListener('click', () => location.reload());
    return;
  }
  const frame = document.createElement('iframe');
  frame.title = title;
  frame.src = src;
  frame.style.cssText = `width:100%;height:100%;border:0;background:${background}`;
  host.replaceChildren(frame);

  // The backend may exit after the preflight but before/during iframe
  // navigation. Poll only while this workbench is the active view and replace
  // Chromium's error document after two consecutive failures. This is one
  // tiny request every three seconds and stops immediately on tab change.
  let consecutiveFailures = 0;
  let monitorBusy = false;
  const monitor = setInterval(async () => {
    if (monitorBusy) return;
    if (!host.isConnected || viewSignal?.aborted) {
      clearInterval(monitor);
      return;
    }
    monitorBusy = true;
    const probeController = new AbortController();
    const probeTimeout = setTimeout(() => probeController.abort(), 1_500);
    try {
      const response = await fetch('/healthz', {
        cache: 'no-store', credentials: 'same-origin', signal: probeController.signal,
      });
      consecutiveFailures = response.ok ? 0 : consecutiveFailures + 1;
    } catch { consecutiveFailures++; }
    finally {
      clearTimeout(probeTimeout);
      monitorBusy = false;
    }
    if (consecutiveFailures < 2 || !host.isConnected) return;
    clearInterval(monitor);
    host.innerHTML = `
      <div data-embedded-offline style="height:100%;display:grid;place-items:center;padding:32px">
        <div style="max-width:560px;text-align:center;background:#14100a;border:1px solid #7a5a20;border-radius:6px;padding:24px">
          <div style="font-size:28px;color:#ff8060;margin-bottom:8px">Connection lost</div>
          <p style="color:#d8c89a">The admin process stopped while this editor was open. Restart <b>Server + Admin</b>, then reconnect.</p>
          <button type="button" data-embedded-retry>Reconnect / sign in</button>
        </div>
      </div>`;
    host.querySelector('[data-embedded-retry]')?.addEventListener('click', () => location.reload());
  }, 3_000);
}

// ---------------------------- Modal ---------------------------------------
function showModal(title, html, actions = []) {
  document.getElementById('modal-host').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${esc(title)}</h3>
        ${html}
        <div id="modal-actions" style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"></div>
      </div>
    </div>
  `;
  const footer = document.getElementById('modal-actions');
  const specs = actions.length ? actions : [{ label: 'Close' }];
  for (const spec of specs) {
    const button = document.createElement('button');
    button.textContent = spec.label ?? 'Close';
    if (spec.danger) button.classList.add('danger');
    if (spec.primary) button.classList.add('primary');
    button.addEventListener('click', async () => {
      if (!spec.action) { closeModal(); return; }
      button.disabled = true;
      try { await spec.action(); closeModal(); }
      catch (e) { button.disabled = false; alert(e?.message ?? String(e)); }
    });
    footer.appendChild(button);
  }
}
function closeModal() { document.getElementById('modal-host').innerHTML = ''; }

// ---------------------------- Util ----------------------------------------
function esc(s) { return String(s ?? '').replace(/[<>&"']/g, (c) => ({
  '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
}[c])); }
// Admin audit #1 — JS-string escape for use inside onclick="...".
// HTML decodes attribute value BEFORE the JS parser runs, so plain
// HTML-encoding `'` to `&#39;` does NOT close the JS string. Use
// backslash escapes that survive the HTML decode.
function escJS(s) {
  return String(s ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/</g, '\\x3C');
}

// ---------------------------- Boot ----------------------------------------
const initialTab = (location.hash || '#dashboard').slice(1);
AdminCore.boot();
activate(tabs[initialTab] ? initialTab : 'dashboard');
// Header telemetry is useful on every tab, but polling a background browser
// window and re-fetching the immutable identity on every tick only wastes
// server work. Ten seconds is still responsive for operator telemetry.
setInterval(refreshDashboard, 10_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDashboard(); });
refreshDashboard();
