<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Studio · UO Node Admin</title>
<link rel="stylesheet" href="/admin-assets/admin.css">
<script src="/admin-assets/admin-core.js"></script>
<script src="/admin-assets/studio-workbenches.js"></script>
<style>
  html,body{height:100%;overflow:hidden}
  body{display:grid;grid-template-rows:58px minmax(0,1fr)}
  .studio-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--admin-border);background:rgba(12,16,21,.96)}
  .studio-top a{color:var(--admin-accent);text-decoration:none;font-weight:700}.studio-top h1{font-size:14px;margin:0;color:var(--admin-accent-strong);letter-spacing:.08em}.spacer{flex:1}
  .work-tabs{display:flex;gap:4px;max-width:42vw;overflow:auto}.work-tab{display:flex;align-items:center;gap:5px;white-space:nowrap;padding:4px 7px}.work-tab.active{border-color:var(--admin-info);color:var(--admin-accent-strong)}.work-tab i{font-style:normal;opacity:.65}
  .studio-shell{display:grid;grid-template-columns:248px minmax(260px,390px) minmax(420px,1fr);min-height:0}
  .studio-sidebar,.studio-list,.studio-editor{min-height:0;overflow:auto;border-right:1px solid var(--admin-border);background:rgba(12,16,21,.75)}
  .studio-sidebar{padding:10px}.studio-list{background:rgba(8,11,15,.6);overflow:hidden;display:flex;flex-direction:column}.studio-editor{border:0;padding:15px 18px}
  .domain{width:100%;display:flex;align-items:center;gap:9px;text-align:left;margin-bottom:4px;border-color:transparent!important;background:transparent!important}.domain.active{background:rgba(218,174,99,.1)!important;border-color:var(--admin-border)!important;color:var(--admin-accent-strong)!important}.domain small{margin-left:auto;color:var(--admin-muted)}
  .list-head{position:sticky;top:0;z-index:4;padding:11px;background:rgba(13,18,24,.98);border-bottom:1px solid var(--admin-border)}.list-head input,.list-head select{width:100%;margin-bottom:7px}.list-actions{display:flex;gap:6px}.list-actions button{flex:1;padding-inline:6px}
  .record-list{padding:0;flex:1;min-height:0}.record{width:100%;height:34px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:5px;text-align:left;border-color:transparent!important;background:transparent!important;margin:0}.record.active{background:rgba(117,188,232,.1)!important;border-color:rgba(117,188,232,.28)!important}.record .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record .meta{font:10px var(--admin-mono);color:var(--admin-muted)}.favorite{color:var(--admin-warning)}
  .editor-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}.preview-art{width:112px;height:112px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--admin-border);border-radius:10px;background:radial-gradient(circle,#202832,#080b0f);overflow:hidden}.preview-art img{max-width:100%;max-height:100%;image-rendering:pixelated}.editor-title{min-width:0}.editor-title h2{margin:0 0 5px;font-size:20px;color:var(--admin-accent-strong)}.editor-title .path{font:11px var(--admin-mono);color:var(--admin-muted);overflow-wrap:anywhere}.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:11px}.field{display:grid;gap:4px;align-content:start}.field.wide{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em}.field textarea{min-height:108px;resize:vertical}.field .hint{font:10px var(--admin-mono);color:var(--admin-muted)}
  .studio-panel{border:1px solid var(--admin-border);border-radius:10px;padding:12px;margin:14px 0;background:rgba(23,29,36,.62)}.studio-panel h3{font-size:12px;margin:0 0 9px;color:var(--admin-accent)}
  .preview-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px}.preview-kv div{padding:7px;border-radius:7px;background:rgba(8,11,15,.48)}.preview-kv b{display:block;font-size:10px;color:var(--admin-muted);text-transform:uppercase}.preview-kv span{font-variant-numeric:tabular-nums}
  .domain-workbench{margin-top:12px;padding-top:10px;border-top:1px solid var(--admin-border)}.domain-workbench h4{margin:0 0 8px;color:var(--admin-accent-strong)}.workbench-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}.workbench-grid>div{padding:8px;border:1px solid rgba(255,255,255,.07);border-radius:7px;background:rgba(8,11,15,.45)}.mini-bars{display:grid;gap:5px}.mini-bar{display:grid;grid-template-columns:80px 1fr 42px;gap:6px;align-items:center;font-size:10px}.mini-bar i{height:7px;border-radius:5px;background:linear-gradient(90deg,var(--admin-accent),#6ed6a3);display:block}.node-graph{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:6px}.node-graph span{min-width:92px;padding:7px;border:1px solid var(--admin-border);border-radius:7px;text-align:center}.node-graph b{color:var(--admin-accent)}.layout-preview{position:relative;width:min(100%,420px);aspect-ratio:4/3;border:1px solid var(--admin-border);overflow:hidden;background:#080b0f}.layout-node{position:absolute;border:1px solid #79bee8;background:#79bee822;font-size:9px;overflow:hidden}.recent-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.recent-chips button{font-size:10px;padding:3px 7px}.schedule-calendar{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:3px}.schedule-calendar b,.schedule-calendar i{padding:5px;border:1px solid var(--admin-border);border-radius:4px;text-align:center;font-size:9px;font-style:normal}.schedule-calendar i.active{background:color-mix(in srgb,var(--admin-accent) 30%,transparent);color:var(--admin-accent-strong)}
  .footprint-preview{position:relative;width:min(100%,360px);aspect-ratio:1;border:1px solid var(--admin-border);background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:20px 20px}.footprint-preview i{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--admin-info);transform:translate(-50%,-50%)}
  .lifecycle{display:flex;gap:5px;flex-wrap:wrap}.lifecycle span{padding:5px 8px;border:1px solid var(--admin-border);border-radius:999px;color:var(--admin-muted)}.lifecycle span+span:before{content:'→';margin-right:10px;color:var(--admin-accent)}
  .special-editor{display:grid;gap:10px}.special-section{border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:10px;background:rgba(8,11,15,.42)}.special-section>h5{margin:0 0 8px;color:var(--admin-accent);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px}.quick-grid label{display:grid;gap:3px;font-size:10px;color:var(--admin-muted)}.quick-grid input,.quick-grid select{width:100%}
  .visual-field{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px;align-items:end}.visual-field>label{min-width:0}.visual-pick{height:30px;padding:2px;display:grid;place-items:center;overflow:hidden}.visual-pick img{max-width:28px;max-height:26px;image-rendering:pixelated}.visual-pick .hue-dot{width:20px;height:20px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .asset-picker-modal{width:min(980px,94vw)!important}.asset-picker-head{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px;align-items:end}.asset-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;max-height:60vh;overflow:auto;margin-top:10px;padding:3px}.asset-choice{min-height:112px;display:grid;grid-template-rows:72px auto auto;place-items:center;gap:2px;padding:5px;overflow:hidden}.asset-choice img{max-width:94px;max-height:70px;object-fit:contain;image-rendering:pixelated}.asset-choice b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.asset-choice small{font:9px var(--admin-mono);color:var(--admin-muted)}.asset-choice .hue-swatch{width:72px;height:56px;border:1px solid #fff4;border-radius:6px;box-shadow:inset 0 0 12px #0005}.asset-picker-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:10px}.asset-picker-foot [data-picker-status]{margin-right:auto}
  .gump-designer{display:grid;grid-template-columns:minmax(480px,1fr) 340px;gap:12px;min-height:430px}.gump-canvas-wrap{min-width:0;overflow:auto;border:1px solid var(--admin-border);border-radius:8px;padding:24px;background-color:#070a0d;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:10px 10px}.gump-stage{position:relative;isolation:isolate;box-shadow:0 15px 40px #000b;background:#111;transform-origin:top left}.gump-node{position:absolute;min-width:6px;min-height:6px;overflow:hidden;cursor:move;outline:1px dashed transparent;color:#eee;font:12px/1.2 var(--admin-font);user-select:none}.gump-node.selected{outline:2px solid var(--admin-info);outline-offset:1px}.gump-node.overflow{box-shadow:inset 0 0 0 2px var(--admin-danger)}.gump-node img{display:block;width:100%;height:100%;object-fit:fill;image-rendering:pixelated;pointer-events:none}.gump-nine{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;pointer-events:none}.gump-nine img{width:auto;height:auto;max-width:none}.gump-nine img:nth-child(2),.gump-nine img:nth-child(8){width:100%;height:auto}.gump-nine img:nth-child(4),.gump-nine img:nth-child(6){width:auto;height:100%}.gump-nine img:nth-child(5){width:100%;height:100%}.gump-node .resize-handle{position:absolute;z-index:2;right:0;bottom:0;width:10px;height:10px;background:var(--admin-info);cursor:nwse-resize}.gump-node-label{white-space:nowrap;text-shadow:1px 1px #000}.gump-node-entry{border:1px inset #a88;background:#f2e4c5;color:#211;padding:2px}.gump-node-html{border:1px solid #816d4b;background:#19140dcc;padding:4px}.gump-node-page{border:1px dashed #877;padding:2px;color:#aaa}.gump-inspector{min-width:0;border:1px solid var(--admin-border);border-radius:8px;padding:11px;background:#0b0f14;overflow:auto}.gump-inspector .gump-control-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.gump-inspector details{margin-top:12px;border-top:1px solid var(--admin-border);padding-top:9px}.gump-inspector summary{cursor:pointer;color:var(--admin-accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.gump-inspector summary small{color:var(--admin-muted);font-weight:400}.gump-layers{display:grid;gap:3px;max-height:250px;overflow:auto;margin-top:8px}.gump-layer{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:5px;text-align:left}.gump-layer.active{border-color:var(--admin-info);color:var(--admin-accent-strong)}.script-modal textarea{width:100%;min-height:55vh;tab-size:2;font:12px/1.5 var(--admin-mono);white-space:pre}.script-meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--admin-muted);font:11px var(--admin-mono)}
  .diff{max-height:48vh;overflow:auto;font:12px/1.5 var(--admin-mono);white-space:pre-wrap;background:#070a0d;padding:10px;border-radius:8px}.diff .add{color:#8adea8}.diff .del{color:#f09289}
  .dirty-dot{color:var(--admin-warning);font-size:18px}.hidden{display:none!important}.load-more{width:calc(100% - 12px);margin:6px}
  @media(max-width:1150px){.studio-shell{grid-template-columns:210px 310px minmax(380px,1fr)}}
  @media(max-width:1050px){.gump-designer{grid-template-columns:1fr}.gump-inspector{max-height:none}}
  @media(max-width:820px){html,body{overflow:auto;height:auto}.studio-top{position:sticky;top:0;z-index:20;flex-wrap:wrap}.studio-shell{display:flex;flex-direction:column}.studio-sidebar{display:flex;overflow-x:auto;gap:4px;padding:6px}.domain{min-width:max-content;width:auto}.studio-list{max-height:42vh}.studio-editor{overflow:visible}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="studio-top">
  <a href="/">← Admin</a><a href="/docs">Docs</a><h1>CONTENT STUDIO</h1><span id="dirty" class="dirty-dot" aria-label="unsaved changes"></span>
  <span id="status" class="muted">Loading catalogue…</span><span class="spacer"></span>
  <div id="work-tabs" class="work-tabs" aria-label="Open work tabs"></div>
  <button id="undo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button>
  <button id="diff">Diff</button><button id="save" class="primary" disabled>Publish</button>
</div>
<div class="studio-shell">
  <aside class="studio-sidebar" id="domains" aria-label="Content domains"></aside>
  <section class="studio-list" aria-label="Records">
    <div class="list-head">
      <select id="source" aria-label="Source file"></select>
      <input id="filter" type="search" placeholder="Filter records…" aria-label="Filter records">
      <div class="list-actions"><button id="new-record">＋ New</button><button id="bulk">Bulk</button><button id="io">Import/export</button></div>
    </div>
    <div id="records" class="record-list"></div>
  </section>
  <main class="studio-editor" id="editor"><div class="admin-state">Choose a content domain and record.</div></main>
</div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
AdminCore.boot();
const $=id=>document.getElementById(id);
const clone=value=>structuredClone(value);
const studio={catalog:null,me:null,domain:null,file:null,data:null,pristine:null,mtime:null,records:[],filtered:[],selected:null,visible:120,undo:[],redo:[],undoArmed:false,favorites:new Set(AdminCore.preference('studio.favorites',[])),recent:AdminCore.preference('studio.recent',[]),draftTimer:null,recordList:null,loadRevision:0};
const workTabs=new AdminCore.WorkTabs(AdminCore.workspaceState,'studio.records');

async function request(method,url,body){return AdminCore.requestBroker.request(method,url,body??null,{signal:AdminCore.viewSignal(),dedupe:method==='GET',cacheTtlMs:method==='GET'?1200:0,priority:method==='GET'?1:0,invalidate:method==='GET'?null:'/api/studio/'})}
function contentEndpoint(file){return file==='@client/client-gumps.json'?'/api/studio/client-gump-definitions':`/api/data-tree/file?path=${encodeURIComponent(file)}`}
function isDirty(){return studio.data!=null&&JSON.stringify(studio.data)!==JSON.stringify(studio.pristine)}
function updateChrome(){const dirty=isDirty(),canEdit=!!studio.me?.scopes?.edit;$('dirty').textContent=dirty?'●':'';$('save').disabled=!dirty||!canEdit;$('undo').disabled=!studio.undo.length||!canEdit;$('redo').disabled=!studio.redo.length||!canEdit;document.title=`${dirty?'• ':''}Content Studio · UO Node Admin`;if(studio.file)$('status').textContent=`${studio.domain.label} · ${studio.file} · ${studio.records.length} records${dirty?' · draft':''}${canEdit?'':` · read-only (${studio.me?.accessLevel||'viewer'})`}`}
function recordLabel(record,index){const v=record.value||{};return String(v.name??v.label??v.title??v.kind??v.type??v.id??v.command??v.result??v.school??record.key??`Record ${index+1}`)}
function recordMeta(record){const v=record.value||{};const id=v.artId??v.itemId??v.body??v.definitionId??v.id??v.serial??record.key;return id==null?'':typeof id==='number'?`${id} · 0x${(id>>>0).toString(16)}`:String(id)}
function pathKey(path){return path.map(part=>String(part).replaceAll('/','~1')).join('/')}
function getAt(path){let value=studio.data;for(const part of path)value=value?.[part];return value}
function setAt(path,value){let host=studio.data;for(let i=0;i<path.length-1;i++)host=host[path[i]];host[path.at(-1)]=value}
function deriveRecords(data){const out=[];if(Array.isArray(data)){data.forEach((value,index)=>out.push({path:[index],key:index,value}));return out}if(data&&typeof data==='object'){for(const [key,value] of Object.entries(data)){if(Array.isArray(value)){value.forEach((entry,index)=>out.push({path:[key,index],key:`${key}/${index}`,group:key,value:entry}))}else out.push({path:[key],key,value})}}return out}
function selectedId(){return studio.selected?pathKey(studio.selected.path):null}
function syncRecords(preferred){studio.records=deriveRecords(studio.data);studio.selected=studio.records.find(record=>pathKey(record.path)===(preferred||selectedId()))||studio.records[0]||null;filterRecords();updateChrome()}
function resetRecordList(){studio.recordList?.destroy();studio.recordList=null}

async function boot(){AdminCore.beginView();await AdminCore.syncPreferences();studio.favorites=new Set(AdminCore.preference('studio.favorites',[]));studio.recent=AdminCore.preference('studio.recent',[]);const params=new URLSearchParams(location.search);[studio.catalog,studio.me]=await Promise.all([request('GET','/api/studio/catalog'),request('GET','/api/auth/me')]);const canEdit=!!studio.me?.scopes?.edit;for(const id of ['new-record','bulk','save','undo','redo'])$(id).disabled=!canEdit;renderDomains();const domain=studio.catalog.domains.find(d=>d.id===params.get('domain'))||studio.catalog.domains[0];await openDomain(domain.id,params.get('file'),params.get('record'))}
function renderDomains(){$('domains').innerHTML=studio.catalog.domains.map(domain=>`<button class="domain" data-domain="${AdminCore.escapeHtml(domain.id)}" title="${AdminCore.escapeHtml(domain.tags.join(', '))}"><span>${domain.icon}</span><span>${AdminCore.escapeHtml(domain.label)}</span><small>${domain.files.length}</small></button>`).join('');$('domains').querySelectorAll('[data-domain]').forEach(button=>button.onclick=()=>openDomain(button.dataset.domain));for(const domain of studio.catalog.domains)AdminCore.addCommand({id:`studio:${domain.id}`,label:`Studio: ${domain.label}`,keywords:domain.tags.join(' '),run:()=>openDomain(domain.id)})}
async function openDomain(id,file,record){
  if(isDirty()&&!confirm('Discard the current unpublished draft?'))return;
  const domain=studio.catalog.domains.find(entry=>entry.id===id);
  if(!domain)return;
  studio.domain=domain;
  document.querySelectorAll('.domain').forEach(button=>button.classList.toggle('active',button.dataset.domain===id));
  $('source').innerHTML=domain.files.map(path=>`<option value="${AdminCore.escapeHtml(path)}">${AdminCore.escapeHtml(path)}</option>`).join('');
  if(!domain.files.length){
    studio.loadRevision++;AdminCore.beginView();resetRecordList();
    studio.file=null;studio.data=[];studio.pristine=[];studio.records=[];studio.filtered=[];studio.selected=null;
    $('status').textContent=`${domain.label} · no source files`;
    AdminCore.renderState($('records'),'empty',{message:'No records are available for this domain.'});
    AdminCore.renderState($('editor'),'empty',{message:'No canonical data file exists for this domain yet.'});
    return;
  }
  await openFile(domain.files.includes(file)?file:domain.files[0],record,{skipDirtyPrompt:true});
}
async function openFile(file,record,{skipDirtyPrompt=false}={}){
  if(!skipDirtyPrompt&&isDirty()&&studio.file&&studio.file!==file&&!confirm('Discard unpublished changes?')){$('source').value=studio.file;return}
  const revision=++studio.loadRevision;
  AdminCore.beginView();
  studio.file=file;$('source').value=file;
  // renderState replaces the host's children. Destroy the VirtualList first;
  // otherwise subsequent loads keep writing into its detached viewport while
  // the visible host remains stuck forever on "Loading records…".
  resetRecordList();
  $('status').textContent=`${studio.domain.label} · ${file} · loading…`;
  AdminCore.renderState($('records'),'loading',{message:'Loading records…'});
  AdminCore.renderState($('editor'),'loading',{message:'Loading editor…'});
  try{
    const payload=await request('GET',contentEndpoint(file));
    if(revision!==studio.loadRevision)return;
    if(payload.error)throw new Error(payload.error);
    studio.data=clone(payload.data);studio.pristine=clone(payload.data);studio.mtime=payload.mtime;studio.undo=[];studio.redo=[];studio.visible=120;
    const draft=loadDraft();if(draft&&confirm('A local unpublished draft exists for this file. Restore it?'))studio.data=draft;else clearDraft();
    if(revision!==studio.loadRevision)return;
    syncRecords(record);renderEditor();updateUrl();
  }catch(error){
    if(revision!==studio.loadRevision||error?.name==='AbortError')return;
    console.error('[studio] record load failed',error);
    resetRecordList();
    AdminCore.renderState($('records'),'error',{message:`Could not load ${file}: ${error?.message||error}`,retry:()=>openFile(file,record,{skipDirtyPrompt:true})});
    AdminCore.renderState($('editor'),'error',{message:'The selected content file could not be loaded.'});
  }
}

function filterRecords(){const query=$('filter').value.trim().toLowerCase();studio.filtered=studio.records.filter((record,index)=>{const hay=`${recordLabel(record,index)} ${recordMeta(record)} ${record.group||''} ${JSON.stringify(record.value)}`.toLowerCase();return !query||hay.includes(query)});renderRecords()}
function renderRecords(){const selected=selectedId();if(!studio.recordList){studio.recordList=new AdminCore.VirtualList($('records'),{itemHeight:38,overscan:8,key:record=>pathKey(record.path),renderItem:(record,index)=>{const id=pathKey(record.path),favorite=studio.favorites.has(`${studio.file}:${id}`);return`<button class="record ${id===selectedId()?'active':''}" data-record="${AdminCore.escapeHtml(id)}"><span class="${favorite?'favorite':''}">${favorite?'★':'☆'}</span><span class="name">${AdminCore.escapeHtml(recordLabel(record,index))}</span><span class="meta">${AdminCore.escapeHtml(recordMeta(record))}</span></button>`}});$('records').addEventListener('click',event=>{const button=event.target.closest('[data-record]');if(!button)return;const record=studio.records.find(entry=>pathKey(entry.path)===button.dataset.record);if(!record)return;if(event.clientX-button.getBoundingClientRect().left<34){toggleFavorite(record);return}studio.selected=record;renderRecords();renderEditor();updateUrl()})}studio.recordList.setItems(studio.filtered,{preserveAnchor:true});if(selected){const index=studio.filtered.findIndex(record=>pathKey(record.path)===selected);if(index>=0&&studio.recordList.nodes.size===0)studio.recordList.scrollToIndex(index)}}
function toggleFavorite(record){const key=`${studio.file}:${pathKey(record.path)}`;studio.favorites.has(key)?studio.favorites.delete(key):studio.favorites.add(key);AdminCore.setPreference('studio.favorites',[...studio.favorites]);renderRecords()}

function fieldInput(key,value){const type=typeof value;if(value!==null&&(type==='object'))return`<div class="field wide"><label for="field-${AdminCore.escapeHtml(key)}">${AdminCore.escapeHtml(key)}</label><textarea id="field-${AdminCore.escapeHtml(key)}" data-field="${AdminCore.escapeHtml(key)}" data-json="1">${AdminCore.escapeHtml(JSON.stringify(value,null,2))}</textarea><div class="hint">JSON ${Array.isArray(value)?`array · ${value.length} entries`:'object'}</div><div class="admin-inline-error" data-error="${AdminCore.escapeHtml(key)}"></div></div>`;if(type==='boolean')return`<div class="field"><label><input type="checkbox" data-field="${AdminCore.escapeHtml(key)}" ${value?'checked':''}> ${AdminCore.escapeHtml(key)}</label></div>`;const inputType=type==='number'?'number':'text';return`<div class="field"><label for="field-${AdminCore.escapeHtml(key)}">${AdminCore.escapeHtml(key)}</label><input id="field-${AdminCore.escapeHtml(key)}" type="${inputType}" data-field="${AdminCore.escapeHtml(key)}" value="${AdminCore.escapeHtml(value??'')}"><div class="admin-inline-error" data-error="${AdminCore.escapeHtml(key)}"></div></div>`}
function artUrl(value){const artId=value?.artId??value?.itemId;if(Number.isFinite(Number(artId)))return`/api/studio/art/${Number(artId)}`;if(Number.isFinite(Number(value?.body)))return`/api/studio/body-art/${Number(value.body)}`;return''}
function listLike(value,...keys){for(const key of keys){const found=value?.[key];if(Array.isArray(found))return found;if(found&&typeof found==='object')return Object.entries(found).map(([name,data])=>({name,...(typeof data==='object'?data:{value:data})}))}return[]}
function miniBars(entries){const values=entries.map(entry=>[String(entry.name??entry.id??entry.kind??entry[0]??'?'),Math.max(0,Number(entry.weight??entry.chance??entry.max??entry.value??entry[1]??1)||0)]);const max=Math.max(1,...values.map(([,v])=>v));return`<div class="mini-bars">${values.slice(0,24).map(([name,v])=>`<div class="mini-bar"><span>${AdminCore.escapeHtml(name)}</span><i style="width:${Math.max(2,100*v/max)}%"></i><b>${Number(v.toFixed?.(2)??v)}</b></div>`).join('')||'<span class="muted">No entries</span>'}</div>`}
function objectSummary(value){if(!value||typeof value!=='object')return'—';return Object.entries(value).slice(0,12).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join(' · ')}
function layoutPreview(value){const controls=listLike(value,'controls','layout','entries');if(!controls.length)return'<p class="muted">No layout controls in this record.</p>';const width=Math.max(1,Number(value.width)||320),height=Math.max(1,Number(value.height)||240);return`<div class="layout-preview">${controls.slice(0,100).map((c,i)=>{const x=Math.max(0,Number(c.x)||0),y=Math.max(0,Number(c.y)||0),w=Math.max(6,Number(c.width??c.w)||50),h=Math.max(6,Number(c.height??c.h)||18);const overflow=x+w>width||y+h>height;return`<span class="layout-node" title="${AdminCore.escapeHtml(c.type??c.kind??`control ${i}`)}${overflow?' · OVERFLOW':''}" style="left:${100*x/width}%;top:${100*y/height}%;width:${100*w/width}%;height:${100*h/height}%;${overflow?'border-color:#ff6b6b;background:#ff6b6b33':''}">${AdminCore.escapeHtml(c.text??c.type??c.kind??i)}</span>`}).join('')}</div>`}
function footprintPreview(parts){if(!parts.length)return'<p class="muted">No footprint components.</p>';const points=parts.map(part=>({x:Number(part.x??part.dx??0)||0,y:Number(part.y??part.dy??0)||0,z:Number(part.z??part.dz??0)||0,id:part.itemId??part.id}));const minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),minY=Math.min(...points.map(p=>p.y)),maxY=Math.max(...points.map(p=>p.y));return`<div class="footprint-preview">${points.slice(0,500).map(p=>`<i title="${AdminCore.escapeHtml(`${p.x},${p.y},${p.z} · ${p.id??'?'}`)}" style="left:${5+90*(p.x-minX)/Math.max(1,maxX-minX)}%;top:${5+90*(p.y-minY)/Math.max(1,maxY-minY)}%;opacity:${Math.max(.35,1-Math.abs(p.z)/100)}"></i>`).join('')}</div>`}
function scheduleCalendar(value){const schedule=value.schedule??value.calendar??value;const days=Array.isArray(schedule.days)?schedule.days.map(Number):[0,1,2,3,4,5,6];const start=Math.max(0,Math.min(23,Number(schedule.startHour??schedule.hourStart??0)||0)),end=Math.max(start+1,Math.min(24,Number(schedule.endHour??schedule.hourEnd??24)||24));const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return`<div class="schedule-calendar">${names.map(name=>`<b>${name}</b>`).join('')}${names.map((_,day)=>`<i class="${days.includes(day)?'active':''}" title="${start}:00–${end}:00 UTC">${days.includes(day)?`${start}–${end}`:'off'}</i>`).join('')}</div>`}
function domainWorkbenchHtml(value){const p=studio.domain.preview;let body='';
  const specialized=window.ContentStudioWorkbench?.render?.(studio.domain.id,value);
  if(specialized)return specialized;
  if(p==='mobile'){const skills=listLike(value,'skills'),equipment=listLike(value,'equipment','outfit'),loot=listLike(value,'loot','lootTable'),resists=value.resists??value.resistances??{};body=`<div class="workbench-grid"><div><b>Equipment</b><p>${AdminCore.escapeHtml(objectSummary(equipment))}</p></div><div><b>Abilities / AI</b><p>${AdminCore.escapeHtml(objectSummary(value.abilities??value.specialAbilities??value.ai??'—'))}</p></div><div><b>Resistances</b><p>${AdminCore.escapeHtml(objectSummary(resists))}</p></div><div><b>Pet</b><p>tame ${AdminCore.escapeHtml(value.tameable??false)} · skill ${AdminCore.escapeHtml(value.tameMinSkill??'—')} · slots ${AdminCore.escapeHtml(value.controlSlots??'—')} · loyalty ${AdminCore.escapeHtml(value.loyalty??'—')}</p></div></div><h4>Skills</h4>${miniBars(skills)}<h4>Loot</h4>${miniBars(loot)}<div class="row"><button data-studio-tool="animations">Validate body animations</button><select data-animation-action aria-label="Animation action">${['idle','walk','run','attack','cast','death','mounted'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><button data-studio-tool="animation-frame">Preview action</button></div><div data-tool-result></div>`}
  else if(p==='item'){const variants=listLike(value,'variants','graphics');body=`<div class="workbench-grid"><div><b>Identity / art</b><p>${AdminCore.escapeHtml(objectSummary({definitionId:value.definitionId??value.id,artId:value.artId??value.itemId,name:value.name??value.label,hue:value.hue??0}))}</p></div><div><b>Properties</b><p>${AdminCore.escapeHtml(objectSummary(value.properties??{}))}</p></div><div><b>Container / script</b><p>${AdminCore.escapeHtml(objectSummary({container:value.container,script:value.script,layer:value.layer??value.equipLayer}))}</p></div></div>${variants.length?`<h4>Art variants</h4><div class="row">${variants.slice(0,16).map(v=>`<img src="/api/studio/art/${Number(v.artId??v.itemId??v.id??v)}" alt="variant" width="48" height="48" style="object-fit:contain;image-rendering:pixelated">`).join('')}</div>`:''}<button data-studio-tool="art">Check art integrity</button><div data-tool-result></div>`}
  else if(p==='create'){const type=value.body!=null?'mobile':value.multiId!=null||value.components?'multi':'item';body=`<div class="workbench-grid"><div><b>Create type</b><p>${type}</p></div><div><b>Name / category</b><p>${AdminCore.escapeHtml(`${value.name??value.kind??value.id??'unnamed'} · ${value.category??'uncategorized'}`)}</p></div><div><b>Tags</b><p>${AdminCore.escapeHtml(Array.isArray(value.tags)?value.tags.join(', '):(value.tags??'—'))}</p></div></div><div class="row">${type==='mobile'?'<button data-studio-tool="animations">Validate animations</button>':type==='item'?'<button data-studio-tool="art">Check art</button>':''}</div><div data-tool-result></div>`}
  else if(p==='multi'){const parts=listLike(value,'components','footprint','tiles');body=`<div class="workbench-grid"><div><b>Kind / dimensions</b><p>${AdminCore.escapeHtml(objectSummary({kind:value.kind??value.type,width:value.width,height:value.height,boat:value.boat,house:value.house,addon:value.addon}))}</p></div><div><b>Footprint (${parts.length})</b><p>${AdminCore.escapeHtml(parts.slice(0,24).map(part=>`${part.x??part.dx??0},${part.y??part.dy??0}:${part.itemId??part.id??'?'}`).join(' · ')||'No components')}</p></div></div>${footprintPreview(parts)}`}
  else if(p==='link'){body=`<div class="node-graph"><span>${AdminCore.escapeHtml(value.from?.name??`${value.x??'?'}:${value.y??'?'}`)}</span><b>⇄</b><span>${AdminCore.escapeHtml(value.to?.name??`${value.targetX??value.destX??'?'},${value.targetY??value.destY??'?'}`)}</span></div><div class="workbench-grid"><div><b>Door / sign</b><p>${AdminCore.escapeHtml(objectSummary({itemId:value.itemId,closedId:value.closedId,openId:value.openId,text:value.text}))}</p></div><div><b>Destination / access</b><p>${AdminCore.escapeHtml(objectSummary(value.destination??value.target??value.conditions??{}))}</p></div></div>`}
  else if(p==='vendor'){const buy=listLike(value,'buy','inventory','stock'),sell=listLike(value,'sell','buyback');body=`<div class="workbench-grid"><div><h4>Client buy gump (${buy.length})</h4>${miniBars(buy.map(item=>({...item,weight:item.price??item.cost??1})))}</div><div><h4>Sell / buyback (${sell.length})</h4>${miniBars(sell.map(item=>({...item,weight:item.price??item.value??1})))}</div></div><p>Restock: ${AdminCore.escapeHtml(value.restockMs??value.restock??'default')} · Rental: ${AdminCore.escapeHtml(objectSummary(value.rental??value.contract??{}))}</p>`}
  else if(p==='craft'){const materials=listLike(value,'materials','resources','requirements'),result=value.result??value.output??{};body=`<div class="node-graph">${materials.slice(0,20).map((m,i)=>`${i?'<b>+</b>':''}<span>${AdminCore.escapeHtml(m.name??m.kind??m.item??m.itemId??'material')} × ${AdminCore.escapeHtml(m.amount??m.count??1)}</span>`).join('')||'<span>No materials</span>'}<b>→</b><span>${AdminCore.escapeHtml(result.name??result.kind??result.itemId??value.name??'result')}</span></div><div class="workbench-grid"><div><b>Profession / category</b><p>${AdminCore.escapeHtml(`${value.profession??'—'} · ${value.category??'—'}`)}</p></div><div><b>Skill / chance</b><p>${AdminCore.escapeHtml(objectSummary({skill:value.skill,min:value.minSkill,max:value.maxSkill,chance:value.chance}))}</p></div><div><b>Missing dependencies</b><p>${materials.some(m=>!(m.name??m.kind??m.item??m.itemId))?'⚠ unnamed material':'none detected'}</p></div></div>`}
  else if(p==='skill'){const cap=Number(value.cap??100),min=Number(value.minSkill??0);body=`<h4>Gain chance preview</h4>${miniBars(Array.from({length:11},(_,i)=>({name:`${Math.round(min+(cap-min)*i/10)}`,value:Math.max(.01,1-i/10)})))}<p>Handler: <code>${AdminCore.escapeHtml(value.handler??value.script??'unmapped')}</code></p>`}
  else if(p==='spell'){body=`<div class="node-graph"><span>🗣 ${AdminCore.escapeHtml(value.words??value.mantra??'Words')}</span><b>→</b><span>⏳ ${AdminCore.escapeHtml(value.castTime??'cast')}</span><b>→</b><span>🎯 ${AdminCore.escapeHtml(value.target??(value.requiresTarget?'object':'self'))}</span><b>→</b><span>✨ ${AdminCore.escapeHtml(value.effect??value.handler??'effect')}</span><b>→</b><span>◷ ${AdminCore.escapeHtml(value.cooldown??0)}</span></div><button data-studio-tool="spell">Run safe cast validation</button><div data-tool-result></div>`}
  else if(p==='combat'){body=`<div class="workbench-grid"><div><b>Damage envelope</b>${miniBars([{name:'min',value:Number(value.dmgMin??value.damage?.min??1)},{name:'average',value:(Number(value.dmgMin??1)+Number(value.dmgMax??value.damage?.max??1))/2},{name:'max',value:Number(value.dmgMax??value.damage?.max??1)}])}</div><div><b>Speed / requirements</b><p>${AdminCore.escapeHtml(objectSummary({speed:value.speed,delay:value.delay,requirements:value.requirements,abilities:value.abilities}))}</p></div></div>`}
  else if(p==='loot'){const entries=listLike(value,'entries','items','drops');body=`<h4>Drop weights</h4>${miniBars(entries)}<button data-studio-tool="loot">Simulate 10,000 drops</button><div data-tool-result></div>`}
  else if(p==='quest'){const steps=listLike(value,'steps','objectives','nodes');body=`<h4>Quest graph</h4><div class="node-graph">${steps.slice(0,40).map((s,i)=>`${i?'<b>→</b>':''}<span>${AdminCore.escapeHtml(s.name??s.id??s.kind??`step ${i+1}`)}</span>`).join('')||'<span>No steps</span>'}</div><p><b>Dialog:</b> ${AdminCore.escapeHtml(objectSummary(value.dialog??{}))}</p><p><b>Reward:</b> ${AdminCore.escapeHtml(objectSummary(value.reward??value.rewards??{}))}</p>`}
  else if(p==='gump')body=`<h4>Layout / overflow preview</h4>${layoutPreview(value)}`;
  else if(p==='environment')body=`<div class="node-graph"><span>🌅 Dawn</span><b>→</b><span>☀️ Day</span><b>→</b><span>🌦 ${AdminCore.escapeHtml(value.weather??value.season??'Weather')}</span><b>→</b><span>🌙 Night</span></div><p>Schedule: ${AdminCore.escapeHtml(objectSummary(value.schedule??value.calendar??{}))}</p>${scheduleCalendar(value)}`;
  else if(p==='world')body=`<div class="workbench-grid"><div><b>Geometry</b><p>${AdminCore.escapeHtml(objectSummary(value.rects??value.rect??value.bounds??{}))}</p></div><div><b>Rules</b><p>${AdminCore.escapeHtml(objectSummary({guards:value.guarded,music:value.music,weather:value.weather,spawns:value.spawns}))}</p></div></div>`;
  else if(p==='book')body=`<div class="workbench-grid"><div><b>Collection / BOD</b><p>${AdminCore.escapeHtml(objectSummary(value.collection??value.requirements??{}))}</p></div><div><b>Achievement / reward</b><p>${AdminCore.escapeHtml(objectSummary(value.achievement??value.reward??{}))}</p></div></div>`;
  if(!body)return'';return`<div class="domain-workbench"><h4>${AdminCore.escapeHtml(studio.domain.label)} workbench</h4>${body}</div>`}
function previewHtml(value){const artId=value.artId??value.itemId;const entries=[['Definition',value.definitionId??value.id??value.kind??value.type??'—'],['Art',artId!=null?`0x${Number(artId).toString(16)}`:'—'],['Name',value.name??value.label??'—'],['Hue',value.hue??0],['Script',value.script??'—'],['Body',value.body??'—'],['Stats',[value.str,value.dex,value.int].filter(x=>x!=null).join('/')||'—'],['HP',value.hp??value.hpMax??'—'],['Mana',value.mana??'—'],['Damage',value.dmgMin!=null?`${value.dmgMin}–${value.dmgMax}`:(value.damage??'—')],['Skill',value.minSkill??value.skillId??'—'],['Target',value.requiresTarget==null?'—':value.requiresTarget?'required':'none'],['Layer',value.layer??value.equipLayer??'—'],['Weight',value.weight??'—'],['Flags',Array.isArray(value.flags)?value.flags.join(', '):(value.flags??'—')]];return`<div class="preview-kv">${entries.map(([k,v])=>`<div><b>${k}</b><span>${AdminCore.escapeHtml(v)}</span></div>`).join('')}</div>${domainWorkbenchHtml(value)}`}
function rememberSelectedRecord(){if(!studio.selected||!studio.file||!studio.domain)return;const entry={domain:studio.domain.id,file:studio.file,path:pathKey(studio.selected.path),label:recordLabel(studio.selected,0)};studio.recent=[entry,...studio.recent.filter(item=>!(item.file===entry.file&&item.path===entry.path))].slice(0,12);AdminCore.setPreference('studio.recent',studio.recent);const title=$('editor').querySelector('.editor-title');if(!title)return;let host=title.querySelector('.recent-chips');if(!host){host=document.createElement('div');host.className='recent-chips';title.appendChild(host)}host.innerHTML=studio.recent.slice(0,5).map((item,index)=>`<button data-recent="${index}" title="${AdminCore.escapeHtml(item.file)}">${AdminCore.escapeHtml(item.label)}</button>`).join('');host.querySelectorAll('[data-recent]').forEach(button=>button.onclick=()=>{const item=studio.recent[Number(button.dataset.recent)];openDomain(item.domain,item.file,item.path)})}
function weightedEntries(value){const entries=listLike(value,'entries','items','drops');return entries.map((entry,index)=>({name:String(entry.name??entry.template??entry.table??entry.itemId??entry.kind??`entry ${index+1}`),weight:Math.max(0,Number(entry.weight??entry.chance??entry.max??1)||0)})).filter(entry=>entry.weight>0)}
async function runStudioTool(tool,host){const value=studio.selected?.value??{};host.innerHTML='<div class="admin-state">Running side-effect-free preview…</div>';try{
  if(tool==='art'){const artId=value.artId??value.itemId;if(!Number.isFinite(Number(artId)))throw new Error('Record has no numeric artId.');const response=await fetch(`/api/studio/art/${Number(artId)}`,{signal:AdminCore.viewSignal()});host.innerHTML=response.ok?`<p class="success">Art 0x${Number(artId).toString(16)} is present in the web atlas (${response.headers.get('content-length')??'?'} bytes).</p>`:`<p class="error">Missing art 0x${Number(artId).toString(16)}.</p>`}
  else if(tool==='animations'){if(!Number.isFinite(Number(value.body)))throw new Error('Record has no numeric body.');const result=await request('GET',`/api/animations/body/${Number(value.body)}`);host.innerHTML=`<pre>${AdminCore.escapeHtml(JSON.stringify(result,null,2))}</pre>`}
  else if(tool==='animation-frame'){if(!Number.isFinite(Number(value.body)))throw new Error('Record has no numeric body.');const action=$('editor').querySelector('[data-animation-action]')?.value??0;host.innerHTML=`<img src="/api/animations/frame/${Number(value.body)}/${action}/0/0" alt="animation action preview" style="max-width:180px;image-rendering:pixelated">`}
  else if(tool==='spell'){const result=await request('POST','/api/studio/sandbox/spell',{spell:value});host.innerHTML=`<p class="${result.ok?'success':'error'}">${result.ok?'Safe lifecycle validation passed.':'Validation failed.'} No spell was executed and the world was not mutated.</p>${result.errors?.map(error=>`<p class="error">${AdminCore.escapeHtml(error.field)}: ${AdminCore.escapeHtml(error.message)}</p>`).join('')??''}${result.warnings?.map(warning=>`<p class="muted">⚠ ${AdminCore.escapeHtml(warning)}</p>`).join('')??''}<div class="node-graph">${result.lifecycle.map((stage,index)=>`${index?'<b>→</b>':''}<span>${AdminCore.escapeHtml(stage.stage)}<br>${AdminCore.escapeHtml(stage.detail??`${stage.durationMs??0} ms`)}</span>`).join('')}</div><pre>${AdminCore.escapeHtml(JSON.stringify(result.matchedRuntime,null,2))}</pre>`}
  else if(tool==='loot'){const entries=weightedEntries(value),total=entries.reduce((sum,e)=>sum+e.weight,0),counts=Object.fromEntries(entries.map(e=>[e.name,0]));let state=0x4e6f6465;for(let i=0;i<10000&&total;i++){state^=state<<13;state^=state>>>17;state^=state<<5;let roll=(state>>>0)/0x100000000*total;for(const e of entries){roll-=e.weight;if(roll<=0){counts[e.name]++;break}}}host.innerHTML=`<table><thead><tr><th>Drop</th><th>Observed</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${AdminCore.escapeHtml(e.name)}</td><td>${((counts[e.name]??0)/100).toFixed(2)}%</td></tr>`).join('')}</tbody></table>`}
  else host.textContent='No tool for this domain.';
}catch(error){host.innerHTML=`<p class="error">${AdminCore.escapeHtml(error.message)}</p>`}}
function wireWorkbench(){rememberSelectedRecord();$('editor').querySelectorAll('[data-studio-tool]').forEach(button=>button.onclick=()=>runStudioTool(button.dataset.studioTool,$('editor').querySelector('[data-tool-result]')));window.ContentStudioWorkbench?.wire?.({root:$('editor'),domain:studio.domain.id,value:studio.selected?.value,canEdit:!!studio.me?.scopes?.edit,request,beforeMutate:armUndo,rerender:renderEditor,mutated:({rerender=false}={})=>{scheduleDraft();updateChrome();renderRecords();if(rerender)renderEditor()}})}
function rememberWorkTab(record){if(!record||!studio.file||!studio.domain)return;const path=pathKey(record.path),id=`${studio.file}#${path}`;workTabs.open({id,label:recordLabel(record,studio.records.indexOf(record)),domain:studio.domain.id,file:studio.file,path});renderWorkTabs()}
function renderWorkTabs(){const snap=workTabs.snapshot(),host=$('work-tabs');host.innerHTML=snap.tabs.map(tab=>`<button class="work-tab ${String(tab.id)===String(snap.active)?'active':''}" data-work-tab="${AdminCore.escapeHtml(tab.id)}" title="${AdminCore.escapeHtml(tab.file)}"><span>${AdminCore.escapeHtml(tab.label)}</span><i data-work-close="${AdminCore.escapeHtml(tab.id)}" aria-label="Close tab">×</i></button>`).join('');host.querySelectorAll('[data-work-tab]').forEach(button=>button.onclick=event=>{const id=button.dataset.workTab;if(event.target.closest('[data-work-close]')){event.stopPropagation();workTabs.close(id);renderWorkTabs();return}const tab=workTabs.snapshot().tabs.find(row=>String(row.id)===id);if(tab){workTabs.activate(id);openDomain(tab.domain,tab.file,tab.path)}})}
function renderEditor(){const record=studio.selected;if(!record){AdminCore.renderState($('editor'),'empty',{message:'No record selected.'});return}rememberWorkTab(record);const value=record.value;if(value==null||typeof value!=='object'){$('editor').innerHTML=`<div class="studio-panel"><h3>${AdminCore.escapeHtml(String(record.key))}</h3>${fieldInput('value',value)}</div>`;wireFields();return}const title=recordLabel(record,studio.records.indexOf(record)),art=artUrl(value);$('editor').innerHTML=`<div class="editor-head"><div class="preview-art">${art?`<img src="${art}" alt="${AdminCore.escapeHtml(title)} preview" onerror="this.replaceWith(document.createTextNode('No art'))">`:'No art'}</div><div class="editor-title"><h2>${AdminCore.escapeHtml(title)}</h2><div class="path">${AdminCore.escapeHtml(studio.file)} #/${AdminCore.escapeHtml(pathKey(record.path))}</div><div class="editor-toolbar"><button id="favorite-record">${studio.favorites.has(`${studio.file}:${pathKey(record.path)}`)?'★ Favorite':'☆ Favorite'}</button><button id="clone-record">Duplicate</button><button id="delete-record" class="danger">Delete</button><button id="copy-link">Copy deep link</button></div></div></div><div class="studio-panel"><h3>Live preview · ${AdminCore.escapeHtml(studio.domain.preview)}</h3>${previewHtml(value)}</div><div class="form-grid">${Object.entries(value).map(([key,field])=>fieldInput(key,field)).join('')}</div>`;wireFields();$('favorite-record').onclick=()=>toggleFavorite(record);$('clone-record').onclick=duplicateRecord;$('delete-record').onclick=deleteRecord;$('copy-link').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>AdminCore.toast('Deep link copied.','success'))}
function wireFields(){const canEdit=!!studio.me?.scopes?.edit;$('editor').querySelectorAll('[data-field]').forEach(input=>{input.disabled=!canEdit;if(!canEdit)return;input.addEventListener('focus',armUndo,{once:true});input.addEventListener('change',()=>applyField(input));input.addEventListener('input',()=>{if(!input.dataset.json)applyField(input)})});if(!canEdit)$('editor').querySelectorAll('#clone-record,#delete-record').forEach(button=>button.disabled=true);wireWorkbench()}
function armUndo(){if(studio.undoArmed)return;studio.undoArmed=true;studio.undo.push(clone(studio.data));if(studio.undo.length>80)studio.undo.shift();studio.redo=[];updateChrome();setTimeout(()=>{studio.undoArmed=false},250)}
function applyField(input){const key=input.dataset.field;let value;const error=$('editor').querySelector(`[data-error="${CSS.escape(key)}"]`);try{if(input.dataset.json)value=JSON.parse(input.value);else if(input.type==='checkbox')value=input.checked;else if(input.type==='number'){value=Number(input.value);if(!Number.isFinite(value))throw new Error('A finite number is required.')}else value=input.value;input.setAttribute('aria-invalid','false');if(error)error.textContent=''}catch(e){input.setAttribute('aria-invalid','true');if(error)error.textContent=e.message;return}if(studio.selected.value&&typeof studio.selected.value==='object')studio.selected.value[key]=value;else setAt(studio.selected.path,value);scheduleDraft();updateChrome();const preview=$('editor').querySelector('.studio-panel .preview-kv')?.parentElement;if(preview){preview.innerHTML=`<h3>Live preview · ${AdminCore.escapeHtml(studio.domain.preview)}</h3>${previewHtml(studio.selected.value)}`;wireWorkbench()}renderRecords()}
function undo(){if(!studio.undo.length)return;studio.redo.push(clone(studio.data));studio.data=studio.undo.pop();syncRecords(selectedId());renderRecords();renderEditor();scheduleDraft()}
function redo(){if(!studio.redo.length)return;studio.undo.push(clone(studio.data));studio.data=studio.redo.pop();syncRecords(selectedId());renderRecords();renderEditor();scheduleDraft()}

function duplicateRecord(){armUndo();const record=studio.selected;if(record.path.length===1&&Array.isArray(studio.data)){const copy=clone(record.value);if(copy.name)copy.name+=' Copy';if(typeof copy.definitionId==='string')copy.definitionId+=`-copy-${Date.now().toString(36)}`;else if(typeof copy.kind==='string')copy.kind+=`-copy-${Date.now().toString(36)}`;else if(copy.id!=null&&typeof copy.id==='number')copy.id=Math.max(...studio.data.map(v=>Number(v?.id)||0))+1;studio.data.splice(record.path[0]+1,0,copy)}else if(record.path.length===2&&Array.isArray(studio.data[record.path[0]])){const copy=clone(record.value);studio.data[record.path[0]].splice(record.path[1]+1,0,copy)}else{AdminCore.toast('Duplicate is available for array records.','warning');return}syncRecords();renderRecords();renderEditor();scheduleDraft()}
async function deleteRecord(){if(!await AdminCore.confirmDanger({title:'Delete record',message:`Delete ${recordLabel(studio.selected,0)} from this draft?`,actionLabel:'Delete'}))return;armUndo();const path=studio.selected.path;if(path.length===1&&Array.isArray(studio.data))studio.data.splice(path[0],1);else if(path.length===2&&Array.isArray(studio.data[path[0]]))studio.data[path[0]].splice(path[1],1);else delete studio.data[path[0]];studio.selected=null;syncRecords();renderRecords();renderEditor();scheduleDraft()}
function newRecord(){armUndo();const record=window.ContentStudioWorkbench?.newRecord?.(studio.domain?.id,studio.file)??{name:'New record'};if(Array.isArray(studio.data))studio.data.unshift(record);else studio.data[`new-${Date.now()}`]=record;syncRecords();renderRecords();renderEditor();scheduleDraft()}

function diffLines(before,after,path=''){const lines=[];if(JSON.stringify(before)===JSON.stringify(after))return lines;if(before&&after&&typeof before==='object'&&typeof after==='object'&&!Array.isArray(before)&&!Array.isArray(after)){for(const key of new Set([...Object.keys(before),...Object.keys(after)]))lines.push(...diffLines(before[key],after[key],`${path}/${key}`));return lines}if(before!==undefined)lines.push({kind:'del',text:`- ${path||'/'}: ${JSON.stringify(before)}`});if(after!==undefined)lines.push({kind:'add',text:`+ ${path||'/'}: ${JSON.stringify(after)}`});return lines}
function showDiff(){const lines=diffLines(studio.pristine,studio.data);showDialog('Change preview',lines.length?`<div class="diff">${lines.slice(0,2000).map(line=>`<div class="${line.kind}">${AdminCore.escapeHtml(line.text)}</div>`).join('')}</div><p class="muted">${lines.length} changed value(s)${lines.length>2000?' · first 2000 shown':''}</p>`:'<div class="admin-state">No changes.</div>')}
function showDialog(title,html,buttons=''){const root=document.createElement('div');root.className='modal-bg';root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${AdminCore.escapeHtml(title)}</h3>${html}<div class="row" style="justify-content:flex-end;margin-top:14px">${buttons}<button data-close>Close</button></div></div>`;document.body.appendChild(root);root.querySelector('[data-close]').onclick=()=>root.remove();root.addEventListener('mousedown',e=>{if(e.target===root)root.remove()});return root}
function validateData(){const errors=[];const ids=new Map();studio.records.forEach((record,index)=>{const v=record.value;if(!v||typeof v!=='object')return;const label=recordLabel(record,index);if(!label.trim())errors.push(`Record ${index+1}: missing name/id.`);const id=v.definitionId??v.id??v.kind??v.type;if(id!=null){if(ids.has(String(id)))errors.push(`Duplicate identity ${id}.`);ids.set(String(id),true)}for(const [key,value] of Object.entries(v))if(typeof value==='number'&&!Number.isFinite(value))errors.push(`${label}.${key}: non-finite number.`)});return errors}
async function publish(){const errors=validateData();if(errors.length){showDialog('Validation failed',`<div class="diff">${errors.map(AdminCore.escapeHtml).join('\n')}</div>`);return}let validation;try{validation=await request('POST','/api/studio/validate',{domain:studio.domain.id,file:studio.file,data:studio.data})}catch(error){AdminCore.toast(`Validation failed: ${error.message}`,'error');return}if(!validation.ok){showDialog('Validation failed',`<div class="diff">${validation.errors.map(error=>`<div class="del">${AdminCore.escapeHtml(error)}</div>`).join('')}</div>`);return}const lines=diffLines(studio.pristine,studio.data);if(!lines.length)return;const warningText=validation.warnings?.length?`\n\nWarnings:\n${validation.warnings.slice(0,12).join('\n')}`:'';const clientJson=studio.file==='@client/client-gumps.json';const ok=await AdminCore.confirmDanger({title:'Publish content changes',message:`Write ${lines.length} changed values to ${studio.file}, create a backup${clientJson?', and update the bundled client layout catalogue':' and hot-reload scripts'}?${warningText}`,phrase:'PUBLISH',actionLabel:'Publish'});if(!ok)return;$('save').disabled=true;try{const result=await request('PUT',contentEndpoint(studio.file),{data:studio.data,expectedMtime:studio.mtime,reload:!clientJson});studio.mtime=result.mtime;studio.pristine=clone(studio.data);studio.undo=[];studio.redo=[];clearDraft();updateChrome();AdminCore.toast(`Published ${studio.file}${result.backup?` · backup ${result.backup}`:''}.`,'success')}catch(error){if(error.status===409||error.payload?.conflict)showDialog('Edit conflict',`<p>The file changed on disk after it was opened. Export this draft or reload before publishing.</p><pre>${AdminCore.escapeHtml(JSON.stringify(error.payload,null,2))}</pre>`);else AdminCore.toast(error.message,'error')}}

function scheduleDraft(){clearTimeout(studio.draftTimer);studio.draftTimer=setTimeout(()=>{try{localStorage.setItem(`nodeuo.studio.draft:${studio.file}`,JSON.stringify(studio.data))}catch{AdminCore.toast('Draft is too large for browser storage; export it before leaving.','warning')}},350)}
function loadDraft(){try{const raw=localStorage.getItem(`nodeuo.studio.draft:${studio.file}`);return raw?JSON.parse(raw):null}catch{return null}}
function clearDraft(){localStorage.removeItem(`nodeuo.studio.draft:${studio.file}`)}
function download(name,data){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
function showIo(){const root=showDialog('Import / export',`<p>Export the complete canonical file or replace the current draft from validated JSON.</p><div class="row"><button data-export>Export JSON</button><button data-import>Import into draft</button></div>`);root.querySelector('[data-export]').onclick=()=>download(studio.file.split('/').at(-1),studio.data);root.querySelector('[data-import]').onclick=()=>$('import-file').click()}
function showBulk(){const root=showDialog('Bulk edit filtered records',`<p>${studio.filtered.length} filtered records. Enter a JSON object; its top-level fields will be merged into every record after preview.</p><textarea data-patch style="min-height:150px">{\n  \"hue\": 0\n}</textarea><div class="admin-inline-error" data-patch-error></div>`,`<button class="primary" data-apply>Preview & apply</button>`);root.querySelector('[data-apply]').onclick=()=>{try{const patch=JSON.parse(root.querySelector('[data-patch]').value);if(!patch||Array.isArray(patch)||typeof patch!=='object')throw new Error('Patch must be an object.');const preview=studio.filtered.slice(0,8).map(record=>`${recordLabel(record,0)}: ${Object.keys(patch).join(', ')}`).join('\n');if(!confirm(`Apply to ${studio.filtered.length} records?\n\n${preview}`))return;armUndo();studio.filtered.forEach(record=>{if(record.value&&typeof record.value==='object')Object.assign(record.value,clone(patch))});root.remove();syncRecords(selectedId());renderRecords();renderEditor();scheduleDraft()}catch(e){root.querySelector('[data-patch-error]').textContent=e.message}}}
function updateUrl(){if(!studio.domain||!studio.file)return;const params=new URLSearchParams({domain:studio.domain.id,file:studio.file});if(studio.selected)params.set('record',pathKey(studio.selected.path));history.replaceState(null,'',`/studio?${params}`)}

$('source').onchange=()=>openFile($('source').value);$('filter').oninput=()=>{studio.visible=120;filterRecords();AdminCore.setPreference(`studio.filter:${studio.domain?.id}`,$('filter').value)};$('new-record').onclick=newRecord;$('bulk').onclick=showBulk;$('io').onclick=showIo;$('diff').onclick=showDiff;$('save').onclick=publish;$('undo').onclick=undo;$('redo').onclick=redo;$('import-file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const value=JSON.parse(await file.text());studio.undo.push(clone(studio.data));studio.data=value;syncRecords();renderRecords();renderEditor();scheduleDraft();AdminCore.toast('Imported into draft; review diff before publishing.','success')}catch(e){AdminCore.toast(`Import failed: ${e.message}`,'error')}finally{event.target.value=''}};
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();publish()}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redo():undo()}});
window.addEventListener('beforeunload',event=>{if(isDirty()){event.preventDefault();event.returnValue=''}});
boot().catch(error=>{console.error(error);AdminCore.renderState($('editor'),'error',{message:error.message,retry:boot})});
</script>
</body>
