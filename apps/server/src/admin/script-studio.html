<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Studio · NodeUO Admin</title>
<link rel="stylesheet" href="/admin-assets/admin.css">
<script src="/admin-assets/admin-core.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}header{display:flex;align-items:center;gap:12px}header a{color:var(--admin-accent);text-decoration:none}.grow{flex:1}.workspace{height:calc(100vh - 59px);display:grid;grid-template-columns:250px minmax(260px,340px) minmax(420px,1fr);min-width:0}.pane{min-width:0;overflow:auto;border-right:1px solid var(--admin-border);padding:14px}.pane:last-child{border-right:0}.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--admin-accent);margin:0 0 10px}.type,.script{display:block;width:100%;text-align:left;margin:0 0 6px;padding:9px}.type.active,.script.active{border-color:var(--admin-accent)!important;background:rgba(218,174,99,.12)!important}.type small,.script small{display:block;color:var(--admin-muted);margin-top:3px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:120px}.field{display:grid;gap:4px;margin-bottom:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hooks{display:flex;gap:6px;flex-wrap:wrap}.hook{display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--admin-border);border-radius:999px;background:var(--admin-surface-2)}.hook input{min-height:0}.source-tabs{display:flex;gap:6px;margin-bottom:8px}.source-tabs button.active{border-color:var(--admin-accent)!important;color:var(--admin-accent-strong)!important}#source{width:100%;height:calc(100vh - 236px);resize:none;tab-size:2;white-space:pre}.status{color:var(--admin-muted);font:12px var(--admin-mono)}.validation{min-height:22px;margin:7px 0;color:var(--admin-muted)}.validation.bad{color:var(--admin-danger)}.validation.good{color:var(--admin-success)}.graph{padding:10px;border:1px solid var(--admin-border);border-radius:8px;background:#0a0e13;font:12px var(--admin-mono);white-space:pre-wrap}.links a{display:block;color:var(--admin-info);margin:7px 0}.badge{display:inline-block;border:1px solid var(--admin-border);border-radius:999px;padding:1px 6px;font-size:11px;color:var(--admin-muted)}dialog{color:var(--admin-text);background:var(--admin-surface);border:1px solid var(--admin-border-strong);border-radius:10px;width:min(850px,90vw)}dialog::backdrop{background:#000a}#inspection{white-space:pre-wrap;font:12px var(--admin-mono);max-height:65vh;overflow:auto}@media(max-width:980px){body{overflow:auto;height:auto}.workspace{height:auto;grid-template-columns:220px 1fr}.pane:last-child{grid-column:1/-1;border-top:1px solid var(--admin-border)}#source{height:60vh}}@media(max-width:650px){.workspace{display:block}.pane{border-right:0;border-bottom:1px solid var(--admin-border)}.twocol{grid-template-columns:1fr}}
</style>
<style>
.source-tabs{align-items:center}.editor{display:grid;grid-template-columns:auto 1fr;height:calc(100vh - 286px);min-height:240px;border:1px solid var(--admin-border);border-radius:6px;overflow:hidden;background:#080b10}.line-numbers{margin:0;padding:9px 8px;min-width:42px;text-align:right;overflow:hidden;color:#667080;background:#0d1118;border-right:1px solid var(--admin-border);font:13px/1.5 var(--admin-mono);user-select:none}#source{width:100%;height:100%;resize:none;tab-size:2;white-space:pre;border:0;border-radius:0;font:13px/1.5 var(--admin-mono);overflow:auto}.diagnostics{max-height:90px;overflow:auto;font:12px var(--admin-mono)}.diagnostics button{display:block;width:100%;padding:3px 6px;text-align:left;border:0;background:transparent;color:var(--admin-muted)}.diagnostics .error{color:var(--admin-danger)}.diagnostics .warning{color:#ffc66d}@media(max-width:980px){.editor{height:60vh}}
</style>
</head>
<body>
<header><a href="/">← Admin</a><strong>Script Studio</strong><span class="status">real runtime registrations · atomic publish · hot-reload rollback</span><span class="grow"></span><button id="content">Content Studio</button><span id="save-state" class="status">connecting…</span></header>
<main class="workspace">
  <section class="pane"><h2>Create</h2><div id="types"></div><h2 style="margin-top:20px">Related content</h2><div id="links" class="links"></div></section>
  <section class="pane"><div class="toolbar"><input id="search" type="search" placeholder="Search scripts, hooks, events…"><button id="new">New</button></div><div id="counts" class="status"></div><div id="scripts"></div></section>
  <section class="pane">
    <div class="toolbar"><button id="generate" class="primary">Generate preview</button><button id="validate">Validate</button><button id="publish" class="primary">Validate & publish</button><button id="format">Format</button><button id="inspect">Graph</button><button id="restore">Archives</button><button id="archive" class="danger">Archive</button></div>
    <div id="form">
      <div class="twocol"><label class="field">Identifier<input id="id" placeholder="my-feature"></label><label class="field">Display name<input id="label" placeholder="My feature"></label></div>
      <label class="field">Description<input id="description" placeholder="What this script owns"></label>
      <label class="field">Visible response / speech<input id="message" value="The script hook ran successfully."></label>
      <div class="twocol"><label class="field" id="access-field">Command access<select id="access"><option>Player</option><option>Counselor</option><option>Seer</option><option selected>GM</option><option>Admin</option></select></label><label class="field" id="aliases-field">Aliases (comma separated)<input id="aliases"></label></div>
      <label class="field" id="region-field">Region name<input id="region" list="regions" placeholder="Britain"><datalist id="regions"></datalist></label>
      <label class="field" id="mobile-field">Mobile template kind<input id="mobile-kind" placeholder="custom-guard"></label>
      <label class="field" id="interval-field">Interval (ms)<input id="interval" type="number" min="250" max="86400000" value="5000"></label>
      <label class="field" id="events-field">Custom event names (comma separated)<input id="events" placeholder="combat:hit, mobile:killed"></label>
      <div class="field"><label>Hooks / triggers</label><div id="hooks" class="hooks"></div></div>
    </div>
    <div class="source-tabs"><button id="source-tab" class="active">Source</button><span id="path" class="status"></span><span class="grow"></span><span id="cursor" class="status">Ln 1, Col 1</span></div>
    <div id="validation" class="validation">Generate a template or open an existing script.</div>
    <div id="diagnostics" class="diagnostics"></div>
    <div class="editor"><pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre><textarea id="source" spellcheck="false" aria-label="JavaScript source" autocomplete="off" autocapitalize="off"></textarea></div>
  </section>
</main>
<dialog id="graph-dialog"><h2>Registration graph</h2><pre id="inspection"></pre><form method="dialog"><button>Close</button></form></dialog>
<dialog id="archive-dialog"><h2>Recoverable archives</h2><div id="archives"></div><form method="dialog"><button>Close</button></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=AdminCore.escapeHtml;
const state={catalog:null,type:'command',path:'',mtime:null,hash:'',pristine:'',inspection:null,validateTimer:null};
const request=(method,url,body)=>AdminCore.requestBroker.request(method,url,body??null,{dedupe:method==='GET',cacheTtlMs:method==='GET'?1500:0,invalidate:method==='GET'?null:'/api/script-studio/'});
const draftKey=()=>`nodeuo.script-studio.draft:${state.path||'new'}`;
function editorMeta(){const source=$('source'),before=source.value.slice(0,source.selectionStart),line=before.split('\n').length,col=before.length-before.lastIndexOf('\n');$('cursor').textContent=`Ln ${line}, Col ${col} · ${source.value.length.toLocaleString()} chars`;$('line-numbers').textContent=Array.from({length:Math.max(1,source.value.split('\n').length)},(_,i)=>i+1).join('\n');}
function setSource(value){$('source').value=value??'';editorMeta()}
function saveDraft(){if(!dirty())return;try{localStorage.setItem(draftKey(),JSON.stringify({path:state.path,source:$('source').value,expectedHash:state.hash,savedAt:Date.now()}))}catch{}}
function clearDraft(key=draftKey()){try{localStorage.removeItem(key)}catch{}}
function dirty(){return $('source').value!==state.pristine}
function updateState(){const d=dirty();$('save-state').textContent=state.path?`${state.path}${d?' · draft':''}`:(d?'new draft':'ready');document.title=`${d?'• ':''}Script Studio · NodeUO Admin`;}
function selectedHooks(){return [...document.querySelectorAll('#hooks input:checked')].map(el=>el.value)}
function formSpec(){return{type:state.type,id:$('id').value,label:$('label').value,description:$('description').value,message:$('message').value,access:$('access').value,aliases:$('aliases').value.split(',').map(v=>v.trim()).filter(Boolean),region:$('region').value,mobileKind:$('mobile-kind').value,intervalMs:Number($('interval').value),hooks:selectedHooks(),eventNames:$('events').value.split(',').map(v=>v.trim()).filter(Boolean)}}
function showValidation(result){const errors=result.errors||[];const warnings=result.warnings||[];$('validation').className=`validation ${errors.length?'bad':result.ok?'good':''}`;$('validation').textContent=errors.length?errors.join(' · '):warnings.length?warnings.join(' · '):'Valid template · lifecycle cleanup enabled';}
function showDiagnostics(result){const rows=result.diagnostics||[];$('diagnostics').innerHTML=rows.map(row=>`<button class="${esc(row.severity)}" data-line="${Number(row.line)||1}">${esc(row.severity)} · ${esc(row.code)} · L${Number(row.line)||1}: ${esc(row.message)}</button>`).join('');document.querySelectorAll('#diagnostics [data-line]').forEach(button=>button.onclick=()=>gotoLine(+button.dataset.line));$('validation').className=`validation ${result.ok?'good':'bad'}`;$('validation').textContent=result.ok?`Valid module · ${result.bytes??0} bytes · SHA-256 ${String(result.hash??'').slice(0,12)}`:'Validation found blocking diagnostics.';}
function gotoLine(line){const source=$('source'),lines=source.value.split('\n');let pos=0;for(let i=1;i<line&&i<=lines.length;i++)pos+=lines[i-1].length+1;source.focus();source.setSelectionRange(pos,pos);editorMeta()}
function renderTypes(){const types=state.catalog.types;$('types').innerHTML=types.map(t=>`<button class="type ${t.id===state.type?'active':''}" data-type="${esc(t.id)}"><strong>${esc(t.label)}</strong><small>${esc(t.description)}</small></button>`).join('');document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>selectType(el.dataset.type));}
function selectType(type){state.type=type;renderTypes();const descriptor=state.catalog.types.find(t=>t.id===type);$('hooks').innerHTML=descriptor.hooks.map((hook,i)=>`<label class="hook"><input type="checkbox" value="${esc(hook)}" ${(i===0||type==='event')?'checked':''}>${esc(hook)}</label>`).join('');$('access-field').hidden=type!=='command';$('aliases-field').hidden=type!=='command';$('region-field').hidden=type!=='region';$('mobile-field').hidden=type!=='mobile';$('interval-field').hidden=type!=='service';$('events-field').hidden=type!=='event';if(!state.path){$('path').textContent=`authored/${type}s/…`;}}
function searchable(row){return JSON.stringify(row).toLowerCase()}
function renderScripts(){const q=$('search').value.trim().toLowerCase();const rows=state.catalog.scripts.filter(row=>!q||searchable(row).includes(q));$('counts').textContent=`${rows.length}/${state.catalog.scripts.length} source modules · ${state.catalog.live.commands.length} live commands · ${state.catalog.live.ai.length} AI behaviors`;$('scripts').innerHTML=rows.map(row=>`<button class="script ${row.path===state.path?'active':''}" data-path="${esc(row.path)}"><strong>${esc(row.path.split('/').pop())}</strong><small><span class="badge">${esc(row.type)}</span> ${esc([...row.commands,...row.itemScripts,...row.ai,...row.events].slice(0,3).join(' · ')||'helper module')}</small></button>`).join('')||'<p class="status">No matching scripts.</p>';document.querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>openFile(el.dataset.path));}
function resetDraft(){if(dirty()&&!confirm('Discard the current draft?'))return false;clearDraft();state.path='';state.mtime=null;state.hash='';state.pristine='';state.inspection=null;setSource('');$('id').value='';$('label').value='';$('description').value='';$('diagnostics').innerHTML='';$('validation').textContent='Choose a type, identifier and hooks, then generate a preview.';renderScripts();updateState();return true}
async function generate(){try{const result=await request('POST','/api/script-studio/preview',formSpec());showValidation(result);if(!result.ok)return;if(dirty()&&$('source').value&&!confirm('Replace the current source with the generated preview?'))return;state.path=result.path;state.mtime=null;state.hash='';state.inspection=result.graph;$('path').textContent=result.path;setSource(result.source);state.pristine='';renderScripts();updateState();scheduleValidation()}catch(error){AdminCore.toast(error.message,'error')}}
async function openFile(path){if(dirty()&&!confirm('Discard unsaved changes?'))return;try{const result=await request('GET',`/api/script-studio/file?path=${encodeURIComponent(path)}`);if(!result.ok)throw new Error(result.error);state.path=path;state.mtime=result.mtime;state.hash=result.hash||'';state.pristine=result.source;state.inspection=result.inspection;let source=result.source;try{const draft=JSON.parse(localStorage.getItem(draftKey())||'null');if(draft?.source!==undefined&&draft.source!==result.source&&confirm(`Restore local draft saved ${new Date(draft.savedAt).toLocaleString()}?`))source=draft.source}catch{}setSource(source);$('path').textContent=path;$('validation').className='validation good';$('validation').textContent=`Loaded ${result.inspection.type} · ${result.inspection.bytes} bytes${result.inspection.loaded?' · active':''}`;selectType(state.catalog.types.some(t=>t.id===result.inspection.type)?result.inspection.type:'event');renderScripts();updateState();scheduleValidation()}catch(error){AdminCore.toast(error.message,'error')}}
async function publish(){if(!state.path){await generate();if(!state.path)return}try{$('publish').disabled=true;$('validation').textContent='Validating module and staging atomic activation…';const result=await request('PUT','/api/script-studio/file',{path:state.path,source:$('source').value,expectedMtime:state.mtime,expectedHash:state.hash,activate:true});if(!result.ok){showDiagnostics(result);throw new Error(result.error)}state.mtime=result.mtime;state.hash=result.hash||'';state.pristine=$('source').value;state.inspection=result.inspection;clearDraft();showDiagnostics({ok:true,bytes:result.inspection?.bytes,hash:result.hash,diagnostics:result.diagnostics});$('validation').textContent=`Published and active${result.backup?` · backup ${result.backup}`:''} · ${result.activation?.initMs??0} ms init`;AdminCore.toast('Script validated, published and activated','success');await loadCatalog(false);updateState()}catch(error){$('validation').className='validation bad';if(!$('validation').textContent.includes('diagnostic'))$('validation').textContent=error.message;AdminCore.toast(error.message,'error')}finally{$('publish').disabled=false}}
async function archive(){if(!state.path||!confirm(`Archive ${state.path}? The source remains recoverable on disk.`))return;try{const result=await request('DELETE',`/api/script-studio/file?path=${encodeURIComponent(state.path)}`,{});if(!result.ok)throw new Error(result.error);clearDraft();AdminCore.toast(`Archived as ${result.archived}`,'success');state.path='';state.mtime=null;state.hash='';state.pristine='';setSource('');await loadCatalog(false);updateState()}catch(error){AdminCore.toast(error.message,'error')}}
async function validateSource(){if(!state.path&&!$('source').value)return;clearTimeout(state.validateTimer);try{$('validate').disabled=true;const result=await request('POST','/api/script-studio/validate',{path:state.path||'authored/preview.js',source:$('source').value});showDiagnostics(result);if(result.inspection)state.inspection=result.inspection}catch(error){$('validation').className='validation bad';$('validation').textContent=error.message}finally{$('validate').disabled=false}}
function scheduleValidation(){clearTimeout(state.validateTimer);state.validateTimer=setTimeout(validateSource,700)}
function formatSource(){const source=$('source').value.split('\n').map(line=>line.replace(/[ \t]+$/u,'')).join('\n').replace(/\n*$/u,'\n');setSource(source);updateState();saveDraft();scheduleValidation()}
async function showArchives(){try{const result=await request('GET',`/api/script-studio/archives?refresh=${Date.now()}`);$('archives').innerHTML=(result.archives||[]).map(row=>`<div class="toolbar"><button data-archive="${esc(row.name)}" data-path="${esc(row.originalPath)}">Restore</button><code>${esc(row.originalPath||row.name)}</code><span class="status">${new Date(row.archivedAt).toLocaleString()} · ${row.bytes} B</span></div>`).join('')||'<p class="status">No archived scripts.</p>';document.querySelectorAll('[data-archive]').forEach(button=>button.onclick=()=>restoreArchive(button.dataset.archive,button.dataset.path));$('archive-dialog').showModal()}catch(error){AdminCore.toast(error.message,'error')}}
async function restoreArchive(archive,path){if(!path||!confirm(`Restore ${path} and activate it?`))return;const result=await request('POST','/api/script-studio/restore',{archive,path});if(!result.ok){AdminCore.toast(result.error,'error');return}$('archive-dialog').close();await loadCatalog(false);await openFile(path);AdminCore.toast('Archive restored and activated','success')}
function inspect(){const data=state.inspection||{path:state.path,note:'Generate or load a source first.'};$('inspection').textContent=JSON.stringify(data,null,2);$('graph-dialog').showModal()}
async function loadCatalog(initial=true){try{state.catalog=await request('GET',`/api/script-studio/catalog?refresh=${Date.now()}`);$('regions').innerHTML=state.catalog.live.regions.map(name=>`<option value="${esc(name)}"></option>`).join('');$('links').innerHTML=state.catalog.links.map(link=>`<a href="${esc(link.href)}">${esc(link.label)} →</a>`).join('');renderTypes();selectType(state.type);renderScripts();if(initial){const wanted=new URLSearchParams(location.search).get('path');if(wanted)await openFile(wanted)}}catch(error){AdminCore.renderState(document.querySelector('.workspace'),'error',{message:error.message,retry:()=>location.reload()})}}
$('generate').onclick=generate;$('validate').onclick=validateSource;$('publish').onclick=publish;$('format').onclick=formatSource;$('restore').onclick=showArchives;$('archive').onclick=archive;$('inspect').onclick=inspect;$('new').onclick=resetDraft;$('content').onclick=()=>location.assign('/studio');$('search').oninput=renderScripts;$('source').oninput=()=>{updateState();editorMeta();saveDraft();scheduleValidation()};$('source').onscroll=()=>{$('line-numbers').scrollTop=$('source').scrollTop};$('source').onkeyup=editorMeta;$('source').onclick=editorMeta;$('source').onkeydown=event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();void publish();return}if((event.ctrlKey||event.metaKey)&&event.shiftKey&&event.key.toLowerCase()==='v'){event.preventDefault();void validateSource();return}if(event.key==='Tab'){event.preventDefault();const el=$('source'),start=el.selectionStart,end=el.selectionEnd;if(start===end){el.setRangeText('  ',start,end,'end')}else{const lineStart=el.value.lastIndexOf('\n',start-1)+1,lineEnd=el.value.indexOf('\n',end);const finish=lineEnd<0?el.value.length:lineEnd,selected=el.value.slice(lineStart,finish),replacement=event.shiftKey?selected.replace(/^ {1,2}/gmu,''):selected.replace(/^/gmu,'  ');el.setRangeText(replacement,lineStart,finish,'select')}el.dispatchEvent(new Event('input'))}};setInterval(saveDraft,5000);window.addEventListener('beforeunload',event=>{saveDraft();if(dirty()){event.preventDefault();event.returnValue=''}});AdminCore.beginView();loadCatalog();
</script>
</body>
</html>
