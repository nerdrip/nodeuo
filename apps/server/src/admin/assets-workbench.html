<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assets · UO Node Admin</title>
<style>
:root{color-scheme:dark;--bg:#080b0f;--panel:#11171e;--panel2:#18212b;--border:#4b3a22;--text:#eee6d5;--muted:#9aa6b3;--accent:#edbe72;--good:#7ed39a;--bad:#ef8278;--blue:#79c4ee}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Segoe UI",sans-serif}body{display:grid;grid-template:48px minmax(0,1fr)/270px 330px minmax(420px,1fr)}header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0f141a;border-bottom:1px solid var(--border)}header a,.link{color:var(--accent);text-decoration:none}header .grow{flex:1}.status{color:var(--muted);font-size:12px}.side,.list{min-height:0;overflow:auto;border-right:1px solid var(--border);background:var(--panel)}.section{padding:10px 12px 6px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.tool-grid{padding:0 9px 10px;display:grid;gap:6px}.tool{display:block;padding:9px;border:1px solid #2c3743;border-radius:6px;background:#121a22;color:var(--text);text-decoration:none}.tool:hover{border-color:var(--accent)}.tool small{display:block;color:var(--muted);margin-top:2px}.module{display:flex;width:100%;border:0;border-top:1px solid #222d37;background:transparent;color:var(--text);padding:8px 12px;text-align:left;cursor:pointer;gap:8px}.module:hover,.module.active{background:var(--panel2);color:var(--accent)}.module .dot{color:var(--good)}.module.missing .dot{color:var(--bad)}.module span:last-child{margin-left:auto;color:var(--muted);font-size:10px}.list{background:#0d1218}.search{position:sticky;top:0;z-index:2;display:flex;gap:6px;padding:9px;background:#10171e;border-bottom:1px solid var(--border)}input,textarea,button,select{font:inherit}input,textarea{background:#080d12;border:1px solid #354351;color:var(--text);border-radius:5px;padding:7px}input{min-width:0;flex:1}button{background:#1a2530;color:var(--text);border:1px solid #3b4b59;border-radius:5px;padding:6px 10px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#30451f;border-color:#678c43;color:#d4f1bb}.danger{border-color:#7a3c39;color:#ffaaa4}.row{width:100%;display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;padding:9px 11px;border:0;border-bottom:1px solid #202932;background:transparent;color:var(--text);text-align:left;cursor:pointer}.row:hover,.row.active{background:#18232d}.row code{color:var(--accent)}.row .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.pager{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:#10171e;border-top:1px solid var(--border)}main{min-height:0;overflow:auto;padding:16px 20px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.detail-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}.detail-head h2{margin:0;font-size:17px}.badge{padding:2px 7px;border:1px solid #445565;border-radius:10px;color:var(--muted);font-size:10px}.preview{min-height:190px;display:grid;place-items:center;border:1px solid #293541;border-radius:8px;background:repeating-conic-gradient(#111820 0 25%,#18212a 0 50%) 0/20px 20px;margin-bottom:14px;overflow:hidden}.preview img{max-width:100%;max-height:360px;image-rendering:pixelated}.preview audio{width:min(100%,520px)}textarea{width:100%;min-height:260px;resize:vertical;font:12px/1.45 "Cascadia Code",Consolas,monospace}.actions{display:flex;gap:8px;align-items:center;margin:10px 0 18px}.hint{padding:10px 12px;background:#111a22;border-left:3px solid var(--blue);color:var(--muted);margin:12px 0}.override{border-top:1px solid var(--border);padding-top:14px}.override h3{margin:0 0 5px}.toast{position:fixed;right:16px;bottom:16px;z-index:9;padding:10px 14px;border:1px solid var(--border);background:#18212b;border-radius:6px;box-shadow:0 8px 30px #0009}.toast.error{border-color:var(--bad);color:#ffc0bc}.toast.good{border-color:var(--good);color:#c9f5d6}@media(max-width:1000px){body{grid-template-columns:220px 280px minmax(360px,1fr)}}
</style>
</head>
<body>
<header><a href="/">← Admin</a><strong>Assets</strong><span class="status">client resources and content tools — graphics remain separate from scripts</span><span class="grow"></span><button id="validate">Validate manifests</button><span id="root-state" class="status">connecting…</span></header>
<aside class="side">
  <div class="section">Server and world editors</div>
  <div id="tools" class="tool-grid"></div>
  <div class="section">Decoded client resources</div>
  <div id="modules"></div>
  <button id="patches" class="module"><span class="dot">●</span><b>Runtime remaps</b><span>JSON</span></button>
</aside>
<section class="list">
  <div class="search"><input id="query" type="search" placeholder="ID, name, or value…"><button id="find">Search</button><button id="open-id" title="Open an exact ID, including a new one">ID</button></div>
  <div id="rows"><div class="empty">Select a resource type.</div></div>
  <div class="pager"><button id="prev">←</button><span id="page" class="status">–</span><button id="next">→</button></div>
</section>
<main id="main"><div class="empty"><div><h2>Asset Workbench</h2><p>Browse manifests, edit metadata, or import reversible graphic overrides.</p></div></div></main>
<input id="png-file" type="file" accept="image/png" hidden>
<script>
'use strict';
const state={catalog:null,kind:null,entries:[],selected:null,offset:0,limit:80,total:0,filtered:0,mtime:0,overrides:{}};
const $=(id)=>document.getElementById(id);
const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message,type='good'){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3600)}
async function request(method,url,body,retry=true){const response=await fetch(url,{method,credentials:'same-origin',headers:body?{'content-type':'application/json','x-idempotency-key':crypto.randomUUID()}:undefined,body:body?JSON.stringify(body):undefined});if(response.status===401){location.href='/login';throw new Error('session expired')}if(response.status===428&&retry){const password=prompt('This change requires fresh authentication. Enter the administrator password:');if(!password)throw new Error('cancelled');const auth=await fetch('/api/auth/reauth',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password})});if(!auth.ok)throw new Error('reauthentication failed');return request(method,url,body,false)}const data=await response.json().catch(()=>({error:`HTTP ${response.status}`}));if(!response.ok||data.error)throw Object.assign(new Error(data.error||`HTTP ${response.status}`),{data});return data}
const size=(n)=>n>=1048576?`${(n/1048576).toFixed(1)} MiB`:n>=1024?`${(n/1024).toFixed(1)} KiB`:`${n||0} B`;
function summary(value){if(typeof value==='string')return value;if(Array.isArray(value))return `${value.length} entries`;if(value&&typeof value==='object')return value.name||value.file||Object.entries(value).slice(0,3).map(([k,v])=>`${k}: ${typeof v==='object'?'…':v}`).join(' · ');return String(value)}
async function init(){try{const [catalog,overrides]=await Promise.all([request('GET','/api/assets/editor/catalog'),request('GET','/api/assets/editor/overrides')]);state.catalog=catalog;state.overrides=overrides.value||{};$('root-state').textContent=catalog.root;renderTools();renderModules();const first=catalog.modules.find((m)=>m.present);if(first)selectKind(first.kind)}catch(error){$('root-state').textContent=error.message;toast(error.message,'error')}}
function renderTools(){$('tools').innerHTML=state.catalog.editors.map((tool)=>`<a class="tool" href="${escapeHtml(tool.href)}" target="_top"><b>${escapeHtml(tool.label)}</b><small>${escapeHtml(tool.purpose)}</small></a>`).join('')}
function countHint(module){const n=module.count??(module.kind==='land'?module.landCount:module.kind==='static'?module.staticCount:module.fontCount);return Number.isFinite(n)?String(n):size(module.size)}
function renderModules(){$('modules').innerHTML=state.catalog.modules.map((m)=>`<button class="module ${m.present?'':'missing'} ${m.kind===state.kind?'active':''}" data-kind="${escapeHtml(m.kind)}"><span class="dot">●</span><b>${escapeHtml(m.label)}</b><span>${escapeHtml(countHint(m))}</span></button>`).join('');$('modules').querySelectorAll('[data-kind]').forEach((button)=>button.onclick=()=>selectKind(button.dataset.kind))}
async function selectKind(kind){state.kind=kind;state.offset=0;state.selected=null;renderModules();await loadEntries()}
async function loadEntries(){if(!state.kind)return;$('rows').innerHTML='<div class="empty">Loading outside the world tick…</div>';try{const q=encodeURIComponent($('query').value.trim());const data=await request('GET',`/api/assets/editor/entries/${encodeURIComponent(state.kind)}?offset=${state.offset}&limit=${state.limit}&q=${q}`);Object.assign(state,{entries:data.entries,total:data.total,filtered:data.filtered,mtime:data.mtime});renderRows();renderPager();if(data.entries.length)selectEntry(data.entries[0].id)}catch(error){$('rows').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;toast(error.message,'error')}}
function renderRows(){$('rows').innerHTML=state.entries.length?state.entries.map((entry)=>`<button class="row ${String(state.selected?.id)===String(entry.id)?'active':''}" data-id="${escapeHtml(entry.id)}"><code>${escapeHtml(entry.id)}</code><span class="summary">${escapeHtml(summary(entry.value))}</span></button>`).join(''):'<div class="empty">No results.</div>';$('rows').querySelectorAll('[data-id]').forEach((row)=>row.onclick=()=>selectEntry(row.dataset.id))}
function renderPager(){const shown=Math.min(state.filtered,state.offset+state.entries.length);$('page').textContent=state.filtered?`${state.offset+1}–${shown} / ${state.filtered}${state.filtered!==state.total?` (${state.total} total)`:''}`:'0';$('prev').disabled=state.offset<=0;$('next').disabled=state.offset+state.limit>=state.filtered}
async function selectEntry(id){try{const data=await request('GET',`/api/assets/editor/entry/${encodeURIComponent(state.kind)}/${encodeURIComponent(id)}`);state.selected=data;state.mtime=data.mtime;renderRows();renderDetail()}catch(error){toast(error.message,'error')}}
async function openExactId(){const raw=$('query').value.trim();if(!raw)return;state.selected=null;await selectEntry(raw);if(!state.selected&&graphicKind()){state.selected={id:raw,value:{absentFromBaseAtlas:true},editable:false,mtime:0};renderDetail()}}
function graphicKind(){return ['land','static','gump','texture'].includes(state.kind)}
function overrideFor(kind,id){const key=kind==='texture'?'texmap':kind;return state.overrides?.[key]?.[String(id)]||null}
function overrideLabel(value){return typeof value==='string'?value:value?.file||''}
function previewHtml(entry){const id=encodeURIComponent(entry.id);if(graphicKind())return `<div class="preview"><img src="/api/assets/editor/preview/${encodeURIComponent(state.kind)}/${id}?v=${state.mtime}" alt="resource ${escapeHtml(entry.id)}"></div>`;if(state.kind==='sound')return `<div class="preview"><audio controls preload="none" src="/api/assets/editor/sound/${id}"></audio></div>`;if(state.kind==='music'&&entry.value?.file)return `<div class="preview"><audio controls preload="none" src="/assets/music/${encodeURIComponent(entry.value.file)}"></audio></div>`;if(state.kind==='hue')return `<div class="preview"><img src="/assets/hues.png" style="width:512px;max-height:260px;object-fit:contain" alt="hue palette"></div>`;if(state.kind==='cursor')return `<div class="preview"><img src="/assets/cursors-atlas.png" alt="cursor atlas"></div>`;if(state.kind==='font')return `<div class="preview"><img src="/assets/fonts.png" alt="font atlas"></div>`;return ''}
function renderDetail(){const entry=state.selected;if(!entry)return;const module=state.catalog.modules.find((m)=>m.kind===state.kind);const overridden=overrideFor(state.kind,entry.id);$('main').innerHTML=`<div class="detail-head"><h2>${escapeHtml(module?.label)} · ${escapeHtml(entry.id)}</h2><span class="badge">${entry.editable?'editable metadata':'read-only manifest'}</span>${overridden?'<span class="badge" style="color:var(--good)">override active</span>':''}</div>${previewHtml(entry)}<label for="json"><b>Manifest record</b></label><textarea id="json" spellcheck="false" ${entry.editable?'':'readonly'}>${escapeHtml(JSON.stringify(entry.value,null,2))}</textarea><div class="actions"><button id="save" class="primary" ${entry.editable?'':'disabled'}>Save metadata</button><button id="reload">Reload</button><span class="status">mtime ${entry.mtime}</span></div><div class="hint">The scripted-gump editor remains in Content Studio. Here a “gump” record means only the client graphic with that ID.</div>${graphicKind()?`<section class="override"><h3>PNG graphic override</h3><p class="status">Importing does not rebuild the atlas. The client loads this graphic by ID; removing it restores the original.</p><div class="actions"><button id="import">Import PNG…</button><button id="remove" class="danger" ${overridden?'':'disabled'}>Remove override</button>${overridden?`<code>${escapeHtml(overrideLabel(overridden))}</code>`:''}</div></section>`:''}`;$('save').onclick=saveEntry;$('reload').onclick=()=>selectEntry(entry.id);if(graphicKind()){$('import').onclick=()=>{$('png-file').value='';$('png-file').click()};$('remove').onclick=removeOverride}}
async function saveEntry(){let value;try{value=JSON.parse($('json').value)}catch(error){toast(`Invalid JSON: ${error.message}`,'error');return}try{const result=await request('PUT',`/api/assets/editor/entry/${encodeURIComponent(state.kind)}/${encodeURIComponent(state.selected.id)}`,{value,expectedMtime:state.mtime});state.mtime=result.after.mtime;toast(`Saved. Backup: ${result.backup||'none'}`);await selectEntry(state.selected.id)}catch(error){toast(error.message,'error')}}
function fileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}
async function importOverride(file){if(!file)return;try{const pngBase64=await fileAsBase64(file);const result=await request('PUT',`/api/assets/editor/override/${encodeURIComponent(state.kind)}/${encodeURIComponent(state.selected.id)}`,{pngBase64});state.overrides=(await request('GET','/api/assets/editor/overrides')).value||{};toast(`Imported ${result.width}×${result.height}`);renderDetail()}catch(error){toast(error.message,'error')}}
async function removeOverride(){if(!confirm('Remove the override and restore the atlas graphic?'))return;try{await request('DELETE',`/api/assets/editor/override/${encodeURIComponent(state.kind)}/${encodeURIComponent(state.selected.id)}`,{});state.overrides=(await request('GET','/api/assets/editor/overrides')).value||{};toast('Original graphic restored');renderDetail()}catch(error){toast(error.message,'error')}}
async function renderPatches(){state.kind=null;state.selected=null;renderModules();$('rows').innerHTML='<div class="empty">Runtime remaps are edited as one versioned document.</div>';try{const data=await request('GET','/api/assets/editor/patches');$('main').innerHTML=`<div class="detail-head"><h2>Runtime remaps</h2><span class="badge">gumps · statics · hues</span></div><div class="hint">A remap points an existing ID to another ID. It is separate from PNG overrides and scripted-gump editing.</div><textarea id="patch-json" spellcheck="false">${escapeHtml(JSON.stringify(data.value,null,2))}</textarea><div class="actions"><button id="patch-save" class="primary">Save remaps</button><span class="status">mtime ${data.mtime}</span></div>`;$('patch-save').onclick=async()=>{try{const value=JSON.parse($('patch-json').value);const result=await request('PUT','/api/assets/editor/patches',{value,expectedMtime:data.mtime});toast(`Remaps saved. Backup: ${result.backup||'none'}`);renderPatches()}catch(error){toast(error.message,'error')}}}catch(error){toast(error.message,'error')}}
async function validateAssets(){const button=$('validate');button.disabled=true;button.textContent='Starting…';try{const started=await request('POST','/api/assets/editor/validation-jobs',{});const id=started.job?.id;if(!id)throw new Error(started.error||'validation job did not start');for(;;){const snapshot=await request('GET',`/api/assets/editor/validation-jobs/${encodeURIComponent(id)}`);const job=snapshot.job;if(!job)throw new Error(snapshot.error||'validation job disappeared');const p=job.progress||{};button.textContent=`Validating ${p.completed||0}/${p.total||'?'}…`;if(job.status==='running'){await new Promise(resolve=>setTimeout(resolve,350));continue}if(job.status==='cancelled')throw new Error('validation cancelled');const result=job.result;if(!result)throw new Error(job.error||'validation failed');const failed=result.checks.filter((check)=>!check.ok);toast(result.ok?`Validated ${result.checks.length} collections in ${result.ms} ms`:`Errors: ${failed.map((row)=>row.kind).join(', ')}`,result.ok?'good':'error');$('main').innerHTML=`<div class="detail-head"><h2>Manifest validation</h2><span class="badge">${result.ms} ms · worker thread</span></div><textarea readonly>${escapeHtml(JSON.stringify(result,null,2))}</textarea>`;break}}catch(error){toast(error.message,'error')}finally{button.disabled=false;button.textContent='Validate manifests'}}
let searchTimer;$('query').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.offset=0;loadEntries()},280)});$('query').addEventListener('keydown',(event)=>{if(event.key==='Enter'){clearTimeout(searchTimer);state.offset=0;loadEntries()}});$('find').onclick=()=>{state.offset=0;loadEntries()};$('open-id').onclick=openExactId;$('patches').onclick=renderPatches;$('validate').onclick=validateAssets;$('prev').onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);loadEntries()};$('next').onclick=()=>{state.offset+=state.limit;loadEntries()};$('png-file').onchange=(event)=>importOverride(event.target.files?.[0]);init();
</script>
</body>
</html>
